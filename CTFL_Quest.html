  {h:"A cadeia do problema", b:"<b>Causa-raiz</b> (por que aconteceu: pressa, suposição, falta de info) → <b>Erro</b> (a pessoa se engana) → <b>Defeito</b> (fica gravado no código ou documento) → <b>Falha</b> (o que você VÊ acontecer ao executar).<br>🧠 Macete: <i>pessoa erra, papel/código tem defeito, sistema falha.</i>"},
  {h:"Os 7 princípios", b:"1. Teste mostra presença, não ausência de defeitos.<br>2. Teste exaustivo é impossível.<br>3. Testar cedo economiza.<br>4. Defeitos se agrupam (80/20).<br>5. Testes se degradam (repetir os mesmos para de achar coisa nova).<br>6. Teste depende do contexto.<br>7. Falácia da ausência de defeitos (sem defeito ≠ útil ao usuário)."},
  {h:"Processo de teste (7 grupos)", b:"<b>Planejamento</b> → objetivos, abordagem, riscos, plano.<br><b>Monitoramento e controle</b> → acompanha o tempo todo, relatório de progresso.<br><b>Análise</b> → O QUE testar (condições de teste).<br><b>Modelagem</b> → COMO testar (casos de teste, itens de cobertura, dados e ambiente necessários).<br><b>Implementação</b> → deixa pronto: procedimentos, scripts, suítes, dados, ambiente, cronograma de execução.<br><b>Execução</b> → roda, compara esperado × real, registra, reporta defeitos.<br><b>Conclusão</b> → relatório de conclusão, lições aprendidas, arquiva testware."},
  {h:"Testware e rastreabilidade", b:"<b>Testware</b> = TUDO que o processo de teste produz (plano, condições, casos, dados, scripts, relatórios...).<br><b>Rastreabilidade</b> = ligar base de teste ↔ testware. Serve para medir cobertura, avaliar impacto de mudanças e risco residual, e ajudar em auditoria. Não serve para achar culpado."},
  {h:"Papéis e habilidades", b:"Dois papéis: <b>gestão de teste</b> (planeja, monitora, conclui) e <b>teste</b> (analisa, modela, implementa, executa). Papel ≠ cargo: qualquer um pode assumir.<br>Habilidades: conhecimento de domínio, pensamento crítico/analítico, comunicação, trabalho em equipe, curiosidade."},
  {h:"Equipe completa e independência", b:"<b>Equipe completa</b>: qualidade é responsabilidade de todos; testador ajuda o negócio a criar testes de aceite e os devs a pensar em testes.<br><b>Independência</b>: quem não escreveu enxerga defeitos diferentes (vieses diferentes). Mas muita independência pode isolar e atrasar."}
 ], traps:["Resultado errado na tela é FALHA, não defeito.","'Provar que não há defeitos' / 'garantir todos' → alternativa errada.","Análise = condições. Modelagem = casos. Não troque!","Levantar riscos com probabilidade/impacto para decidir abordagem = Planejamento."]},

 {n:2, t:"Teste no Ciclo de Vida", icon:"🔄", peso:6, cards:[
  {h:"SDLC influencia o teste", b:"<b>Sequencial (cascata/V)</b>: no início só dá teste <b>estático</b> (revisões); dinâmico só quando há código.<br><b>Iterativo/incremental/ágil</b>: cada iteração entrega algo → estático e dinâmico em todos os níveis, muita regressão."},
  {h:"Boas práticas (valem para qualquer SDLC)", b:"• Toda atividade de desenvolvimento tem uma de teste.<br>• Cada nível tem objetivo próprio (evita redundância).<br>• Análise e modelagem começam junto com a fase correspondente.<br>• Testador revisa rascunhos assim que existem."},
  {h:"TDD, ATDD, BDD", b:"<b>TDD</b>: teste de código primeiro → falha → código → passa → refatora.<br><b>ATDD</b>: testes de aceite criados ANTES, a partir dos critérios de aceite, com negócio+dev+teste.<br><b>BDD</b>: comportamento em linguagem natural <i>Dado / Quando / Então</i>."},
  {h:"DevOps e Shift-left", b:"<b>DevOps</b>: pipeline CI/CD, testes automatizados, feedback rápido, software sempre executável. Riscos: montar automação é caro, precisa de MAIS regressão.<br><b>Shift-left</b>: testar mais cedo — revisar requisitos, escrever testes antes do código, análise estática, CI."},
  {h:"Retrospectivas", b:"Ao fim da iteração: o que deu certo, o que melhorar, ações concretas. Alimentam a melhoria contínua. Não é para punir ninguém."},
  {h:"Níveis de teste", b:"<b>Componente</b> (unidade isolada, geralmente pelo dev).<br><b>Integração de componentes</b> (interfaces entre partes; top-down, bottom-up, big-bang).<br><b>Sistema</b> (sistema inteiro, regras de negócio, funcional e não funcional).<br><b>Integração de sistemas</b> (com outros sistemas/serviços externos).<br><b>Aceite</b> (atende o usuário/negócio? UAT, operacional, contratual/regulatório, alfa, beta)."},
  {h:"Tipos de teste", b:"<b>Funcional</b> = O QUE faz.<br><b>Não funcional</b> = QUÃO BEM faz (desempenho, usabilidade, segurança, confiabilidade, compatibilidade...).<br><b>Caixa-preta</b> = baseado na especificação.<br><b>Caixa-branca</b> = baseado na estrutura/código."},
  {h:"Confirmação × Regressão", b:"<b>Confirmação</b>: o defeito corrigido sumiu? (reexecuta o teste que falhou).<br><b>Regressão</b>: a mudança quebrou algo que funcionava? (roda testes que passavam)."},
  {h:"Teste de manutenção", b:"Gatilhos: <b>modificação</b> (melhorias, correções), <b>migração/atualização</b> de ambiente ou plataforma, <b>aposentadoria</b> (desligar sistema/módulo — testar migração e arquivamento de dados). Sempre com análise de impacto."}
 ], traps:["Tempo de resposta/desempenho = NÃO funcional.","'Interfaces', 'funcionam juntos' = integração.","Teste que falhou antes → próxima execução é confirmação. Que passou antes → regressão.","Dado/Quando/Então = BDD (ou formato de critério de aceite), não é a definição de ATDD."]},

 {n:3, t:"Teste Estático", icon:"📄", peso:4, cards:[
  {h:"O que é", b:"Examinar produtos de trabalho <b>sem executar</b>: revisões (manuais) e análise estática (ferramenta). Quase tudo pode ser revisado: requisitos, histórias, código, planos, contratos, modelos... menos um executável (binário) de terceiros."},
  {h:"Por que vale a pena", b:"Acha defeitos <b>cedo e barato</b>, encontra coisas que o dinâmico não acha (código morto, desvio de padrão, requisito ambíguo), melhora a comunicação e evita mal-entendidos."},
  {h:"Estático × Dinâmico", b:"<b>Estático</b> acha DEFEITOS diretamente (sem executar).<br><b>Dinâmico</b> provoca FALHAS e daí se chega ao defeito.<br>🧠 Revisão nunca acha 'falha'."},
  {h:"Processo de revisão (5 atividades)", b:"1. <b>Planejamento</b>: escopo, objetivo, critérios de saída, esforço, prazo.<br>2. <b>Início</b>: todos preparados, com acesso ao material.<br>3. <b>Revisão individual</b>: cada um revisa e anota anomalias.<br>4. <b>Comunicação e análise</b>: discute as anomalias e decide o que fazer.<br>5. <b>Correção e relatório</b>: relatório de defeitos, correções, resultado."},
  {h:"Funções na revisão", b:"<b>Gerente</b>: decide o que revisar, dá recursos (gente e tempo).<br><b>Autor</b>: cria e corrige o produto.<br><b>Moderador/facilitador</b>: faz a reunião funcionar, media, controla tempo, ambiente seguro.<br><b>Relator</b>: junta as anomalias e registra decisões.<br><b>Revisor</b>: revisa.<br><b>Líder da revisão</b>: responsabilidade geral, decide quem participa, quando e onde."},
  {h:"Tipos de revisão (do menos ao mais formal)", b:"<b>Informal</b>: sem processo, sem documento.<br><b>Walkthrough</b>: <u>conduzido pelo autor</u>; educar, gerar ideias, avaliar qualidade.<br><b>Revisão técnica</b>: revisores técnicos, liderada por moderador; consenso e decisões técnicas.<br><b>Inspeção</b>: a mais formal, processo completo, <u>coleta métricas</u>, autor NÃO pode ser líder nem relator."},
  {h:"Fatores de sucesso", b:"Objetivos claros, partes pequenas, tempo adequado, facilitação, feedback para todos, ambiente seguro, treinamento, apoio da gestão."}
 ], traps:["Autor conduzindo = walkthrough.","Métricas + mais formal = inspeção.","Revisões acham defeitos, não falhas.","Executável de terceiros não dá para testar estaticamente."]},

 {n:4, t:"Técnicas de Teste", icon:"🧪", peso:11, cards:[
  {h:"3 famílias", b:"<b>Caixa-preta</b> (especificação): partição de equivalência, valor limite, tabela de decisão, transição de estados.<br><b>Caixa-branca</b> (estrutura): instrução e ramificação.<br><b>Experiência</b>: suposição de erro, exploratório, checklist."},
  {h:"Partição de equivalência (PE)", b:"Divide os valores em grupos que o sistema trata igual. Testa <b>1 valor por partição</b> (válidas E inválidas).<br>Ex.: idade 18–60 válida → partições: &lt;18 | 18–60 | &gt;60 → 3 testes (ex.: 10, 30, 70).<br>Cobertura = partições testadas ÷ total."},
  {h:"Valor limite (BVA)", b:"Testa as bordas das partições.<br><b>2 valores</b>: o limite + o vizinho do outro lado. Faixa 18–60: 17, 18, 60, 61.<br><b>3 valores</b>: vizinho antes + limite + vizinho depois. 17, 18, 19, 59, 60, 61.<br>⚠️ Use o passo que o enunciado mandar (0,1 V, 1 t, 1 ponto...)."},
  {h:"Tabela de decisão", b:"Para regras com <b>combinação de condições</b>. Cada coluna = uma regra (combinação) → ação. Com N condições booleanas há até 2ᴺ colunas. Fique atento a combinações <b>impossíveis</b> e a ações erradas."},
  {h:"Transição de estados", b:"Estados + eventos que mudam de estado.<br><b>Todos os estados</b>: visitar cada estado.<br><b>Transições válidas</b> (0-switch): passar por cada seta válida.<br><b>Todas as transições</b>: válidas + inválidas.<br>Cobertura = itens cobertos ÷ total. Se 'voltar ao início encerra o caso', cada volta = 1 caso."},
  {h:"Cobertura de instrução", b:"Cada linha/caixa executável = 1 instrução. Cobertura = instruções executadas ÷ total.<br>100% instrução ≠ 100% ramificação."},
  {h:"Cobertura de ramificação (decisão)", b:"Cada saída de uma decisão (if: sim e não) = 1 ramificação. Cobertura = ramificações exercitadas ÷ total.<br>✅ 100% de ramificação garante 100% de instrução (o contrário não).<br>Um if sozinho: 1 caso = 50% de ramificação."},
  {h:"Valor da caixa-branca", b:"Forte: considera toda a implementação, funciona mesmo com especificação ruim, mede cobertura objetiva, dá para usar em revisão de código.<br>Fraco: <b>não acha requisito que nunca foi implementado</b>."},
  {h:"Baseadas em experiência", b:"<b>Suposição de erro</b>: 'já vi esse erro antes' — ataque de falhas, listas de erros comuns.<br><b>Exploratório</b>: aprende, modela e executa AO MESMO TEMPO; ótimo com pouca documentação e pouco tempo (sessões com carta de teste).<br><b>Checklist</b>: lista de itens para lembrar de verificar."},
  {h:"Abordagem colaborativa", b:"<b>História de usuário 3C</b>: Cartão, Conversação, Confirmação (critérios de aceite).<br>Boa história: INVEST.<br><b>Critério de aceite</b>: condições para estar 'pronto' (formato cenário Dado/Quando/Então ou lista de regras).<br><b>ATDD</b>: testes de aceite escritos antes, a partir dos critérios, guiando o desenvolvimento."}
 ], traps:["PE: precisa de valor em TODAS as partições, inclusive as inválidas.","BVA: conte cada limite. Faixa com 6 notas = 12 limites.","Cobertura de estados conta estados DIFERENTES, não repetições.","'Todas as transições' inclui as inválidas; 'transições válidas' não.","Caixa-branca não acha o que não foi codificado."]},

 {n:5, t:"Gerenciamento do Teste", icon:"📊", peso:9, cards:[
  {h:"Plano de teste", b:"Documenta objetivos, escopo, abordagem, recursos, cronograma, riscos, critérios de entrada/saída, orçamento, comunicação."},
  {h:"Critérios de entrada e saída", b:"<b>Entrada</b> (posso começar?): ambiente pronto, acesso, requisitos testáveis, smoke test passou.<br><b>Saída</b> (posso terminar?): cobertura atingida, densidade de defeitos, testes planejados executados, regressão automatizada.<br>No ágil: Definição de Pronto (DoR) e Definição de Feito (DoD)."},
  {h:"Estimativas", b:"<b>Razão</b>: usa proporção histórica (dev:teste).<br><b>Extrapolação</b>: projeta a partir de dados anteriores (ex.: média das iterações).<br><b>Wideband Delphi / Planning Poker</b>: especialistas até consenso.<br><b>Três pontos</b>: E = (O + 4M + P) ÷ 6."},
  {h:"Priorização de casos", b:"Baseada em <b>risco</b>, em <b>cobertura</b> ou em <b>requisitos</b>. Mas as <b>dependências</b> vêm primeiro: não dá para rodar um teste antes do que ele depende."},
  {h:"Pirâmide e quadrantes", b:"<b>Pirâmide</b>: base = muitos testes de unidade (rápidos); topo = poucos E2E (lentos).<br><b>Quadrantes</b>: Q1 tecnologia/apoia equipe (componente) · Q2 negócio/apoia equipe (funcional, histórias, protótipos) · Q3 negócio/critica produto (exploratório, usabilidade, UAT) · Q4 tecnologia/critica produto (desempenho, segurança, confiabilidade)."},
  {h:"Risco", b:"Nível de risco = <b>probabilidade × impacto</b>.<br><b>Projeto</b>: prazo, custo, pessoas, fornecedor, organização.<br><b>Produto</b>: qualidade do software (defeitos, desempenho, usabilidade, segurança).<br>Resposta: <b>mitigar</b> (ex.: testar), aceitar, transferir, plano de contingência."},
  {h:"Monitoramento, controle e relatórios", b:"<b>Monitorar</b>: coletar métricas e comparar com o plano. <b>Controlar</b>: agir para corrigir o rumo.<br>Relatório de <b>progresso</b> (durante) × relatório de <b>conclusão</b> (no fim).<br>Burndown: trabalho restante × tempo."},
  {h:"Gerenciamento de configuração", b:"Identifica, versiona e controla itens de teste e testware. Garante que se sabe qual versão foi testada."},
  {h:"Relatório de defeito", b:"Objetivo: dar informação para reproduzir e corrigir. Contém: ID, título, data/autor, <b>item de teste e ambiente</b>, contexto, passos, esperado × real, gravidade, prioridade, status, referências."}
 ], traps:["Três pontos: (O + 4M + P) / 6 — o 'mais provável' vale 4x.","Dependência manda mais que prioridade.","Exploratório e usabilidade = Q3. Componente = Q1.","Testar para reduzir risco = mitigação.","Risco de custo/prazo/equipe = projeto."]},

 {n:6, t:"Ferramentas de Teste", icon:"🛠️", peso:2, cards:[
  {h:"Tipos de ferramentas", b:"Gerenciamento (requisitos, testes, defeitos, configuração) · Teste estático · Modelagem e implementação (inclui preparação de dados) · Execução e cobertura · Não funcional (carga, desempenho) · <b>DevOps</b> (pipeline CI/CD) · Colaboração · Virtualização e conteinerização."},
  {h:"Benefícios da automação", b:"Menos trabalho manual repetitivo, mais consistência e repetibilidade, medidas objetivas (cobertura), feedback mais rápido, libera testadores para testes mais inteligentes."},
  {h:"Riscos da automação", b:"<b>Expectativas irreais</b> sobre a ferramenta · subestimar tempo/custo/esforço de introdução e <b>manutenção</b> do testware · usar ferramenta quando manual seria melhor · depender demais da ferramenta · fornecedor sumir · ferramenta open source abandonada · incompatibilidade com a plataforma."}
 ], traps:["Reduzir teste manual é BENEFÍCIO, não risco.","CI/CD = ferramenta de DevOps.","Preparar dados = apoio à implementação."]}
];

<script>
// ================== CTFL QUEST — lógica do app ==================
const KEY = "ctflquest_v1";
const LEVELS = [[0,"Estagiário de QA","🐣"],[150,"Testador Júnior","🔍"],[400,"Testador Pleno","🧪"],[800,"Testador Sênior","🛡️"],[1400,"Analista de Teste","🧠"],[2200,"Test Lead","🚀"],[3200,"Mestre CTFL","🏆"]];
const L = "abcd";
let S = load();
let SES = null; // sessão de quiz atual
let timerInt = null;

function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  return Object.assign({xp:0,streak:0,lastDay:null,q:{},ach:{},blitz:0,sims:[],flash:0,sorts:{},answered:0,correct:0,maxCombo:0,reviewCleared:0}, d||{});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} topbar(); }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = (a) => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const today = () => new Date().toISOString().slice(0,10);

function qs(q){ // estado de uma questão
  if (!S.q[q.id]) return {s:0,c:0,box:q.w?0:-1};
  return S.q[q.id];
}
function inReview(q){ const st = qs(q); return st.box >= 0 && st.box <= 1; }
function reviewList(){ return Q.filter(inReview); }
function mastery(ch){
  const list = Q.filter(q => q.ch === ch);
  const m = list.filter(q => qs(q).box >= 2).length;
  return list.length ? m / list.length : 0;
}
function starsFor(p){ return p>=.9?3:p>=.7?2:p>=.4?1:0; }
function level(){ let i=0; LEVELS.forEach((l,k)=>{ if(S.xp>=l[0]) i=k; }); return i; }

function touchDay(){
  const t = today();
  if (S.lastDay === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
  S.lastDay = t;
}
function topbar(){ $("tXp").textContent = S.xp; $("tStreak").textContent = S.streak; }

function toast(msg){ const t=$("toast"); t.innerHTML=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
function confetti(){ const e=["🎉","⭐","✨","🏆","💜","🎯"]; for(let i=0;i<28;i++){ const s=document.createElement("div"); s.className="conf"; s.textContent=e[i%e.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDelay=(Math.random()*.6)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3000);} }
function flyXp(n, el){ if(!el) return; const r=el.getBoundingClientRect(); const f=document.createElement("div"); f.className="xpfly"; f.textContent="+"+n+" XP"; f.style.left=(r.right-90)+"px"; f.style.top=(r.top)+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1000); }

function addXp(n, el){
  const before = level();
  S.xp += n; touchDay();
  if (el) flyXp(n, el);
  const after = level();
  if (after > before){ confetti(); toast(`${LEVELS[after][2]} Subiu de nível: <b>${LEVELS[after][1]}</b>!`); }
  checkAch(); save();
}

// ================== CONQUISTAS ==================
const ACH = [
 ["first","🌱","Primeiro passo","Responda sua primeira questão.",()=>S.answered>=1],
 ["c5","🔥","Combo x5","Acerte 5 seguidas.",()=>S.maxCombo>=5],
 ["c10","⚡","Combo x10","Acerte 10 seguidas.",()=>S.maxCombo>=10],
 ["q50","📚","50 questões","Responda 50 questões.",()=>S.answered>=50],
 ["q200","🏋️","200 questões","Responda 200 questões.",()=>S.answered>=200],
 ["rev","🧹","Caçador de erros","Zere a fila de revisão de erros.",()=>S.reviewCleared>0],
 ["ch1","🧱","Mestre dos Fundamentos","Domine 80% do Cap. 1.",()=>mastery(1)>=.8],
 ["ch2","🔄","Mestre do Ciclo de Vida","Domine 80% do Cap. 2.",()=>mastery(2)>=.8],
 ["ch3","📄","Mestre do Estático","Domine 80% do Cap. 3.",()=>mastery(3)>=.8],
 ["ch4","🧪","Mestre das Técnicas","Domine 80% do Cap. 4.",()=>mastery(4)>=.8],

 ["sim80","💎","Aprovado com folga","Tire 80% ou mais em um simulado.",()=>S.sims.some(s=>s.score/s.total>=.8)],
 ["blitz","⏱️","Relâmpago","Faça 10 acertos no modo Relâmpago.",()=>S.blitz>=10],
 ["flash","🃏","Memória afiada","Revise 50 flashcards.",()=>S.flash>=50],
 ["sort","🧩","Organizador","Faça 100% em um jogo de classificar.",()=>Object.values(S.sorts).some(v=>v>=1)],
 ["d3","📅","3 dias seguidos","Estude 3 dias seguidos.",()=>S.streak>=3],
 ["d7","🗓️","Semana perfeita","Estude 7 dias seguidos.",()=>S.streak>=7]
];
function checkAch(){
  ACH.forEach(a=>{ if(!S.ach[a[0]] && a[4]()){ S.ach[a[0]] = today(); setTimeout(()=>toast(`${a[1]} Conquista: <b>${a[2]}</b>`), 300); } });
}

// ================== NAVEGAÇÃO ==================
function go(view, arg){
  clearInterval(timerInt);
  window.scrollTo(0,0);
  const V = {home, chapter, flash, sorts, sortGame, ach, stats, simMenu};
  (V[view]||home)(arg);
}
function render(h){ $("app").innerHTML = h; }

// ================== HOME ==================
function home(){
  const lv = level(), cur = LEVELS[lv], nxt = LEVELS[lv+1];
  const pct = nxt ? (S.xp-cur[0])/(nxt[0]-cur[0])*100 : 100;
  const rv = reviewList().length;
  // foco sugerido: capítulo com maior (peso × falta de domínio)
  const focus = CHAPTERS.slice().sort((a,b)=> b.peso*(1-mastery(b.n)) - a.peso*(1-mastery(a.n)))[0];
  const achN = Object.keys(S.ach).length;
  render(`
  <div class="card hero">
    <div class="lv">${cur[2]} Nível ${lv+1}</div>
    <h2>${cur[1]}</h2>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="lv">${nxt ? `${S.xp} / ${nxt[0]} XP para <b>${nxt[1]}</b>` : "Nível máximo! Você está pronto. 🏆"}</div>
  </div>
  <div class="grid">
    <button class="tile big" onclick="startDaily()"><div class="ic">🎯</div><div><b>Missão do dia</b><br><small>10 questões misturadas: seus erros + o que mais cai na prova. Comece por aqui.</small></div></button>
    <button class="tile" onclick="startReview()"><div class="ic">🩹</div><b>Revisar erros ${rv?`<span class="badge">${rv}</span>`:""}</b><small>Questões que você errou (inclusive nos seus simulados). Acerte 2x para sair da fila.</small></button>
    <button class="tile" onclick="go('simMenu')"><div class="ic">🎓</div><b>Simulado da prova</b><small>40 questões, 60 min, sem ajuda. Passa com 26 (65%).</small></button>
    <button class="tile" onclick="startBlitz()"><div class="ic">⏱️</div><b>Relâmpago</b><small>60 segundos. Quantas você acerta? Recorde: ${S.blitz}</small></button>
    <button class="tile" onclick="go('flash')"><div class="ic">🃏</div><b>Flashcards</b><small>${FLASH.length} termos do glossário para decorar.</small></button>
    <button class="tile" onclick="go('sorts')"><div class="ic">🧩</div><b>Classificar</b><small>Jogos rápidos: erro/defeito/falha, grupos do processo, funções da revisão...</small></button>
    <button class="tile" onclick="go('ach')"><div class="ic">🏅</div><b>Conquistas</b><small>${achN} de ${ACH.length} desbloqueadas.</small></button>
  </div>
  <h3>Trilha por capítulo</h3>
  <div class="card" style="padding:12px 16px;font-size:14.5px">💡 <b>Foco sugerido:</b> Cap. ${focus.n} – ${focus.t} (vale ~${focus.peso} das 40 questões da prova e seu domínio está em ${Math.round(mastery(focus.n)*100)}%).</div>
  ${CHAPTERS.map(c=>{ const m=mastery(c.n); const n=Q.filter(q=>q.ch===c.n).length; return `
  <button class="chap" onclick="go('chapter',${c.n})">
    <div class="num">${c.icon}</div>
    <div class="info"><b>Cap. ${c.n} · ${c.t}</b><br><small>${n} questões · ~${c.peso} na prova</small>
      <div class="bar g" style="height:7px;margin:6px 0 0"><i style="width:${m*100}%"></i></div></div>
    <div class="stars">${"★".repeat(starsFor(m))}${"☆".repeat(3-starsFor(m))}</div>
  </button>`}).join("")}
  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="go('stats')">📈 Estatísticas</button></div>
  `);
}

// ================== CAPÍTULO ==================
function chapter(n, tab){
  const c = CHAPTERS.find(x=>x.n===n); tab = tab||"resumo";
  const m = mastery(n);
  const games = SORTS.filter(s=>s.ch===n);
  let body = "";
  if (tab==="resumo"){
    body = c.cards.map((k,i)=>`<div class="card lesson"><h4>${i+1}. ${k.h}</h4>${k.b}</div>`).join("")
      + `<button class="btn full" onclick="startChapter(${n})">Bora treinar o Cap. ${n} →</button>`;
  } else if (tab==="pegadinhas"){
    body = `<div class="card"><p class="mut" style="margin-top:0">O que mais derruba na prova neste capítulo:</p>${c.traps.map(t=>`<div class="trap">⚠️ ${t}</div>`).join("")}</div>`;
  } else if (tab==="jogos"){
    body = games.length ? games.map(g=>`<button class="chap" onclick="go('sortGame','${g.id}')"><div class="num">🧩</div><div class="info"><b>${g.t}</b><br><small>${g.items.length} itens · melhor: ${Math.round((S.sorts[g.id]||0)*100)}%</small></div></button>`).join("") : `<div class="card mut">Sem jogos de classificar para este capítulo. Use os flashcards!</div>`;
  }
  render(`
   <div class="card">
     <div class="row" style="align-items:center"><div style="font-size:34px">${c.icon}</div><div style="flex:1"><b style="font-size:19px">Cap. ${n} · ${c.t}</b><br><span class="mut" style="font-size:14px">Domínio: ${Math.round(m*100)}% · ~${c.peso} questões na prova</span></div><div class="stars" style="font-size:20px">${"★".repeat(starsFor(m))}${"☆".repeat(3-starsFor(m))}</div></div>
     <div class="bar g"><i style="width:${m*100}%"></i></div>
     <div class="row" style="margin-top:12px"><button class="btn" onclick="startChapter(${n})">▶ Quiz do capítulo</button><button class="btn sec" onclick="go('home')">← Voltar</button></div>
   </div>
   <div class="tabs">
     <button class="${tab==='resumo'?'on':''}" onclick="chapter(${n},'resumo')">📖 Resumo</button>
     <button class="${tab==='pegadinhas'?'on':''}" onclick="chapter(${n},'pegadinhas')">⚠️ Pegadinhas</button>
     <button class="${tab==='jogos'?'on':''}" onclick="chapter(${n},'jogos')">🧩 Jogos</button>
   </div>${body}`);
}

// ================== MONTAGEM DE SESSÕES ==================
function weakScore(q){ const st=qs(q); if (st.box<0) return 2 + Math.random(); return (4-st.box) + Math.random()*1.5; } // maior = mais urgente
function pickWeak(list, n){ return list.slice().sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,n); }

function startChapter(n){
  const list = shuffle(pickWeak(Q.filter(q=>q.ch===n), 10));
  startQuiz({mode:"chapter", title:`Cap. ${n}`, list, hearts:3, back:()=>go('chapter',n)});
}
function startDaily(){
  const rv = shuffle(reviewList()).slice(0,4);
  const ids = new Set(rv.map(q=>q.id));
  const rest = [];
  const weights = {1:8,2:6,3:4,4:11,5:9,6:2};
  const pool = Q.filter(q=>!ids.has(q.id));
  while (rv.length + rest.length < 10 && pool.length){
    // escolhe capítulo pelo peso da prova
    let r = Math.random()*40, ch = 1; for (const k in weights){ r -= weights[k]; if (r<=0){ ch=+k; break; } }
    const cands = pool.filter(q=>q.ch===ch);
    const q = cands.length ? pickWeak(cands,3)[Math.floor(Math.random()*Math.min(3,cands.length))] : pool[0];
    rest.push(q); pool.splice(pool.indexOf(q),1);
  }
  startQuiz({mode:"daily", title:"Missão do dia", list: shuffle(rv.concat(rest)), hearts:3, back:()=>go('home')});
}
function startReview(){
  const list = shuffle(reviewList()).slice(0,15);
  if (!list.length){ toast("🎉 Nenhum erro na fila! Faça a Missão do dia."); return; }
  startQuiz({mode:"review", title:"Revisar erros", list, hearts:0, back:()=>go('home')});
}
function startBlitz(){
  const list = shuffle(Q.filter(q=>!q.img && q.q.length < 330 && !q.q.includes("<table")));
  startQuiz({mode:"blitz", title:"Relâmpago", list, hearts:0, time:60, back:()=>go('home')});
}

// ================== QUIZ (modo treino) ==================
function startQuiz(cfg){
  SES = Object.assign({i:0, ok:0, combo:0, xp:0, done:[], answered:false, hadHearts: !!cfg.hearts}, cfg);
  if (cfg.time){ SES.endAt = Date.now()+cfg.time*1000; timerInt = setInterval(tickBlitz, 250); }
  showQ();
}
function tickBlitz(){
  const left = Math.max(0, Math.ceil((SES.endAt-Date.now())/1000));
  const el = $("tmr"); if (el) el.textContent = left+"s";
  if (left<=0){ clearInterval(timerInt); endQuiz(); }
}
function qHtml(q){
  return `<div class="qtext">${q.q}</div>${q.img?DIAG[q.img]:""}`;
}
function showQ(){
  const q = SES.list[SES.i];
  if (!q){ endQuiz(); return; }
  SES.answered = false;
  const st = qs(q);
  const hearts = SES.hearts ? `<span class="hearts">${"❤️".repeat(SES.hearts)}${"🖤".repeat(3-SES.hearts)}</span>` : "";
  const prog = SES.mode==="blitz" ? `⏱️ <span class="timer" id="tmr">${Math.max(0,Math.ceil((SES.endAt-Date.now())/1000))}s</span> · ✅ ${SES.ok}` : `${SES.i+1}/${SES.list.length}`;
  render(`
   <div class="card">
    <div class="qhead"><b style="color:var(--txt)">${SES.title}</b> · ${prog}<div class="sp"></div>${SES.combo>=2?`<span class="combo">🔥 x${SES.combo}</span>`:""} ${hearts}</div>
    ${SES.mode!=="blitz"?`<div class="bar" style="height:6px;margin:0 0 12px"><i style="width:${SES.i/SES.list.length*100}%"></i></div>`:""}
    <div style="margin-bottom:8px"><span class="tag">Cap. ${q.ch}</span> <span class="tag">${esc(q.src)}</span> ${q.w && st.c===0?'<span class="tag w">⚠ você errou no simulado</span>':""}</div>
    ${qHtml(q)}
    <div id="opts">${q.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})"><span class="l">${L[k]}</span>${o}</button>`).join("")}</div>
    <div id="fb"></div>
   </div>
   <div class="row"><button class="btn sec" onclick="endQuiz()">Encerrar</button></div>`);
}
function answer(k){
  if (SES.answered) return; SES.answered = true;
  const q = SES.list[SES.i], right = k===q.a;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("o"+q.a).classList.add("ok"); if (!right) $("o"+k).classList.add("bad");
  // estado
  const st = Object.assign({s:0,c:0,box:q.w?0:-1}, S.q[q.id]||{});
  const wasReview = inReview(q);
  st.s++; S.answered++;
  if (right){ st.c++; S.correct++; st.box = Math.min(4, Math.max(st.box,0)+1); SES.ok++; SES.combo++; S.maxCombo=Math.max(S.maxCombo,SES.combo); }
  else { st.box = 0; SES.combo = 0; if (SES.hearts) SES.hearts--; }
  S.q[q.id] = st;
  if (wasReview && reviewList().length===0) S.reviewCleared++;
  let gain = 0;
  if (right){ gain = SES.mode==="blitz" ? 5 : 10 + Math.min(Math.max(SES.combo-1,0),5)*2; SES.xp += gain; addXp(gain, $("o"+q.a)); } else { touchDay(); checkAch(); save(); }
  SES.done.push({q, k, right});
  if (SES.mode==="blitz"){ setTimeout(()=>{ SES.i++; showQ(); }, right?350:1400); if(!right) $("fb").innerHTML = `<div class="fb bad"><b>Resposta: ${L[q.a]})</b>${q.e}</div>`; return; }
  const cheer = ["Mandou bem!","Isso aí!","Acertou!","Boa!","Na mosca! 🎯"];
  $("fb").innerHTML = `<div class="fb ${right?"ok":"bad"}"><b>${right?cheer[Math.floor(Math.random()*cheer.length)]+(SES.combo>=3?` 🔥 Combo x${SES.combo}`:""):"Não foi dessa vez — a certa é a "+L[q.a]+")"}</b>💡 ${q.e}</div>
   <div class="row" style="margin-top:12px"><button class="btn full" id="nextBtn" onclick="nextQ()">${(SES.hadHearts && SES.hearts===0) || SES.i===SES.list.length-1 ? "Ver resultado" : "Continuar →"}</button></div>`;
  $("nextBtn").focus();
}
function nextQ(){
  if (SES.mode!=="review" && SES.hearts===0 && SES.hadHearts){ endQuiz(); return; }
  SES.i++; showQ();
}
function endQuiz(){
  clearInterval(timerInt);
  const n = SES.done.length, ok = SES.ok;
  if (SES.mode==="blitz" && ok > S.blitz){ S.blitz = ok; toast(`⏱️ Novo recorde no Relâmpago: <b>${ok}</b>!`); }
  checkAch(); save();
  const pct = n ? ok/n : 0;
  const stars = starsFor(pct);
  if (stars===3 && n>=5) confetti();
  const wrong = SES.done.filter(d=>!d.right);
  const msg = pct>=.9?"Excelente! Você está voando. 🚀":pct>=.7?"Muito bom! Continue assim. 💪":pct>=.5?"Bom caminho — revise os erros abaixo. 📖":"Tudo bem errar: é assim que se aprende. Revise e tente de novo. 🌱";
  render(`
   <div class="card center">
     <div style="font-size:40px">${SES.hearts===0&&SES.hadHearts?"💔":"🏁"}</div>
     <div class="stars" style="font-size:32px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
     <div class="big">${ok}/${n}</div>
     <div class="mut">+${SES.xp} XP ganhos</div>
     <p>${msg}</p>
     <div class="row" style="justify-content:center"><button class="btn" onclick="(${SES.mode==='blitz'?'startBlitz':SES.mode==='daily'?'startDaily':SES.mode==='review'?'startReview':'()=>startChapter('+SES.list[0].ch+')'})()">Jogar de novo</button><button class="btn sec" onclick="go('home')">Início</button></div>
   </div>
   ${wrong.length?`<h3>Revise o que errou</h3>`+wrong.map(d=>`<div class="card"><div style="margin-bottom:6px"><span class="tag">Cap. ${d.q.ch}</span></div>${qHtml(d.q)}<div class="fb ok"><b>✅ ${L[d.q.a]}) ${d.q.o[d.q.a]}</b>${d.q.e}</div></div>`).join(""):""}
  `);
}


// ================== SIMULADO ==================
function simMenu(){
  const hist = S.sims.slice(-5).reverse();
  render(`
  <div class="card"><h2 style="margin-top:0">🎓 Simulado da prova</h2>
   <p class="mut">Igual à prova real: 40 questões, 60 minutos, sem mostrar a resposta na hora. Aprovação com <b>26 acertos (65%)</b>. Você pode navegar entre as questões e mudar respostas antes de entregar.</p>
   <button class="chap" onclick="startExam('rand')"><div class="num">🎲</div><div class="info"><b>Simulado aleatório</b><br><small>Sorteado do banco com a mesma distribuição da prova (8·6·4·11·9·2 por capítulo). Cada vez é diferente.</small></div></button>
   <button class="chap" onclick="startExam(1)"><div class="num">1️⃣</div><div class="info"><b>Simulado Completo 1</b><br><small>O seu simulado 1 completo (40 questões, com o gabarito oficial).</small></div></button>
   <button class="chap" onclick="startExam(2)"><div class="num">2️⃣</div><div class="info"><b>Simulado Completo 2</b><br><small>${Q.filter(q=>q.sim===2).length} questões do seu simulado 2 (o PDF veio sem gabarito — respostas resolvidas pelo Syllabus).</small></div></button>
   <button class="btn sec" onclick="go('home')">← Voltar</button>
  </div>
  ${hist.length?`<div class="card"><b>Últimos simulados</b>${hist.map(h=>`<div class="stat"><span>${h.date} · ${h.mode}</span><b style="color:${h.score/h.total>=.65?'var(--ok)':'var(--bad)'}">${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</b></div>`).join("")}</div>`:""}`);
}
function startExam(mode){
  let list;
  if (mode==="rand"){
    const dist = {1:8,2:6,3:4,4:11,5:9,6:2}; list = [];
    for (const ch in dist) list = list.concat(shuffle(Q.filter(q=>q.ch===+ch)).slice(0,dist[ch]));
  } else list = Q.filter(q=>q.sim===mode).sort((a,b)=>a.ch-b.ch);
  SES = {mode:"exam", label: mode==="rand"?"Aleatório":"Simulado "+mode, list, i:0, ans:{}, endAt: Date.now()+60*60*1000};
  timerInt = setInterval(tickExam, 1000);
  showExamQ();
}
function tickExam(){
  const left = Math.max(0, SES.endAt-Date.now());
  const el = $("etmr"); if (el){ const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); el.textContent = `${m}:${String(s).padStart(2,"0")}`; if(left<5*60000) el.style.color="var(--bad)"; }
  if (left<=0){ clearInterval(timerInt); finishExam(); }
}
function showExamQ(){
  const q = SES.list[SES.i], a = SES.ans[q.id];
  const answered = Object.keys(SES.ans).length;
  render(`
  <div class="card">
   <div class="qhead"><b style="color:var(--txt)">🎓 ${SES.label}</b> · ${SES.i+1}/${SES.list.length}<div class="sp"></div>⏳ <span class="timer" id="etmr">--:--</span></div>
   <div class="nav">${SES.list.map((x,k)=>`<button class="${SES.ans[x.id]!==undefined?"ans":""} ${k===SES.i?"cur":""}" onclick="SES.i=${k};showExamQ()">${k+1}</button>`).join("")}</div>
   ${qHtml(q)}
   ${q.o.map((o,k)=>`<button class="opt ${a===k?"sel":""}" onclick="SES.ans['${q.id}']=${k};showExamQ()"><span class="l">${L[k]}</span>${o}</button>`).join("")}
   <div class="row" style="margin-top:10px">
    <button class="btn sec" ${SES.i===0?"disabled":""} onclick="SES.i--;showExamQ()">← Anterior</button>
    <div class="sp"></div>
    ${SES.i<SES.list.length-1?`<button class="btn" onclick="SES.i++;showExamQ()">Próxima →</button>`:""}
   </div>
  </div>
  <div class="row"><button class="btn ok" onclick="if(confirm('Entregar o simulado? Respondidas: ${answered}/${SES.list.length}'))finishExam()">Entregar simulado (${answered}/${SES.list.length})</button><button class="btn sec" onclick="if(confirm('Sair sem salvar?'))go('home')">Sair</button></div>`);
  tickExam();
}
function finishExam(){
  clearInterval(timerInt);
  let ok = 0; const byCh = {};
  SES.list.forEach(q=>{
    const k = SES.ans[q.id], right = k===q.a;
    byCh[q.ch] = byCh[q.ch]||[0,0]; byCh[q.ch][1]++; if(right){ ok++; byCh[q.ch][0]++; }
    const st = Object.assign({s:0,c:0,box:q.w?0:-1}, S.q[q.id]||{});
    st.s++; S.answered++;
    if (right){ st.c++; S.correct++; st.box=Math.min(4,Math.max(st.box,0)+1);} else st.box = 0;
    S.q[q.id]=st;
  });
  const total = SES.list.length, pct = ok/total, pass = pct>=.65;
  S.sims.push({date: today(), mode: SES.label, score: ok, total});
  const gain = ok*8 + (pass?100:0);
  addXp(gain);
  if (pass) confetti();
  render(`
   <div class="card center">
     <div style="font-size:46px">${pass?"🎓":"📚"}</div>
     <div class="big" style="color:${pass?"var(--ok)":"var(--bad)"}">${ok}/${total}</div>
     <div style="font-size:18px;font-weight:700">${Math.floor(pct*100)}% · ${pass?"APROVADO! 🎉":"Ainda não — precisa de 65%"}</div>
     <div class="mut">+${gain} XP</div>
   </div>
   <div class="card"><b>Desempenho por capítulo</b>
    ${Object.keys(byCh).map(ch=>{const [a,t]=byCh[ch]; const c=CHAPTERS[ch-1]; return `<div class="stat"><span>${c.icon} Cap. ${ch} · ${c.t}</span><b style="color:${a/t>=.65?'var(--ok)':'var(--bad)'}">${a}/${t}</b></div>`}).join("")}
   </div>
   <div class="row"><button class="btn" onclick="go('simMenu')">Outro simulado</button><button class="btn sec" onclick="go('home')">Início</button></div>
   <h3>Correção comentada</h3>
   ${SES.list.map((q,i)=>{ const k=SES.ans[q.id], r=k===q.a; return `<div class="card"><div style="margin-bottom:6px"><b>${i+1}.</b> ${r?"✅":"❌"} <span class="tag">Cap. ${q.ch}</span></div>${qHtml(q)}
     ${!r?`<div class="fb bad"><b>Sua resposta: ${k===undefined?"(em branco)":L[k]+") "+q.o[k]}</b></div>`:""}
     <div class="fb ok"><b>✅ ${L[q.a]}) ${q.o[q.a]}</b>${q.e}</div></div>`}).join("")}`);
}

// ================== FLASHCARDS ==================
let FD = null;
function flash(){
  if (!FD || !FD.deck.length) FD = {deck: shuffle(FLASH.map((f,i)=>i)), known:0};
  const i = FD.deck[0], f = FLASH[i];
  render(`
   <div class="card"><div class="qhead"><b style="color:var(--txt)">🃏 Flashcards</b><div class="sp"></div>Restam ${FD.deck.length} · Sabia: ${FD.known}</div>
    <div class="flash" id="fc" onclick="this.classList.toggle('fl')"><div class="in"><div class="f">${f[0]}</div><div class="b">${f[1]}</div></div></div>
    <p class="center mut" style="margin:0 0 12px">Toque no card para virar.</p>
    <div class="row"><button class="btn sec" style="flex:1" onclick="flashAns(false)">😕 Não sabia</button><button class="btn ok" style="flex:1" onclick="flashAns(true)">😎 Sabia</button></div>
   </div><button class="btn sec" onclick="FD=null;go('home')">← Voltar</button>`);
}
function flashAns(k){
  const i = FD.deck.shift();
  S.flash++;
  if (k){ FD.known++; addXp(2); } else { FD.deck.splice(Math.min(3,FD.deck.length),0,i); touchDay(); checkAch(); save(); }
  if (!FD.deck.length){ render(`<div class="card center"><div style="font-size:44px">🃏</div><div class="big">${FD.known}</div><p>Deck completo! Você passou por todos os termos.</p><div class="row" style="justify-content:center"><button class="btn" onclick="FD=null;flash()">De novo</button><button class="btn sec" onclick="FD=null;go('home')">Início</button></div></div>`); return; }
  flash();
}

// ================== CLASSIFICAR ==================
function sorts(){
  render(`<div class="card"><h2 style="margin-top:0">🧩 Classificar</h2><p class="mut">Leia o item e toque na categoria certa. Ótimo para decorar o que a prova cobra de memória.</p>
   ${SORTS.map(g=>`<button class="chap" onclick="go('sortGame','${g.id}')"><div class="num">${CHAPTERS[g.ch-1].icon}</div><div class="info"><b>${g.t}</b><br><small>Cap. ${g.ch} · ${g.items.length} itens · melhor: ${Math.round((S.sorts[g.id]||0)*100)}%</small></div></button>`).join("")}
   <button class="btn sec" onclick="go('home')">← Voltar</button></div>`);
}
let SG = null;
function sortGame(id){
  const g = SORTS.find(x=>x.id===id);
  SG = {g, items: shuffle(g.items), i:0, ok:0, lock:false};
  sortShow();
}
function sortShow(){
  const it = SG.items[SG.i];
  if (!it){
    const p = SG.ok/SG.items.length;
    if (p > (S.sorts[SG.g.id]||0)) S.sorts[SG.g.id] = p;
    if (p===1) confetti();
    checkAch(); save();
    render(`<div class="card center"><div style="font-size:44px">🧩</div><div class="stars" style="font-size:30px">${"★".repeat(starsFor(p))}${"☆".repeat(3-starsFor(p))}</div><div class="big">${SG.ok}/${SG.items.length}</div><div class="row" style="justify-content:center"><button class="btn" onclick="sortGame('${SG.g.id}')">De novo</button><button class="btn sec" onclick="go('sorts')">Outros jogos</button></div></div>`);
    return;
  }
  SG.lock = false;
  render(`<div class="card"><div class="qhead"><b style="color:var(--txt)">🧩 ${SG.g.t}</b><div class="sp"></div>${SG.i+1}/${SG.items.length} · ✅ ${SG.ok}</div>
   <div class="bar" style="height:6px;margin:0 0 12px"><i style="width:${SG.i/SG.items.length*100}%"></i></div>
   <div class="item">${it[0]}</div>
   <div class="cats">${SG.g.cats.map((c,k)=>`<button id="c${k}" onclick="sortAns(${k})">${c}</button>`).join("")}</div>
   </div><button class="btn sec" onclick="go('sorts')">← Sair</button>`);
}
function sortAns(k){
  if (SG.lock) return; SG.lock = true;
  const it = SG.items[SG.i], right = k===it[1];
  $("c"+it[1]).classList.add("ok"); if(!right) $("c"+k).classList.add("bad");
  if (right){ SG.ok++; addXp(3, $("c"+k)); } else { touchDay(); save(); }
  setTimeout(()=>{ SG.i++; sortShow(); }, right?550:1500);
}

// ================== CONQUISTAS / ESTATÍSTICAS ==================
function ach(){
  render(`<div class="card"><h2 style="margin-top:0">🏅 Conquistas</h2>
   ${ACH.map(a=>`<div class="ach ${S.ach[a[0]]?"":"off"}"><div class="e">${a[1]}</div><div><b>${a[2]}</b><br><small>${a[3]}${S.ach[a[0]]?" · ✅ "+S.ach[a[0]]:""}</small></div></div>`).join("")}
   <h3>Níveis</h3>${LEVELS.map((l,i)=>`<div class="stat"><span>${l[2]} ${l[1]}</span><span class="mut">${l[0]} XP ${level()>=i?"✅":""}</span></div>`).join("")}
   <div style="margin-top:12px"><button class="btn sec" onclick="go('home')">← Voltar</button></div></div>`);
}
function stats(){
  const acc = S.answered ? Math.round(S.correct/S.answered*100) : 0;
  render(`<div class="card"><h2 style="margin-top:0">📈 Estatísticas</h2>
   <div class="stat"><span>Questões respondidas</span><b>${S.answered}</b></div>
   <div class="stat"><span>Acertos</span><b>${acc}%</b></div>
   <div class="stat"><span>Maior combo</span><b>${S.maxCombo}</b></div>
   <div class="stat"><span>Na fila de revisão</span><b>${reviewList().length}</b></div>
   <div class="stat"><span>Questões no banco</span><b>${Q.length}</b></div>
   <h3>Por capítulo</h3>
   ${CHAPTERS.map(c=>{ const list=Q.filter(q=>q.ch===c.n); let s=0,k=0; list.forEach(q=>{const st=qs(q); s+=st.s; k+=st.c;}); return `<div class="stat"><span>${c.icon} Cap. ${c.n} · ${c.t}</span><span>${s?Math.round(k/s*100)+"% acerto · ":""}<b>${Math.round(mastery(c.n)*100)}% domínio</b></span></div>`}).join("")}
   <p class="mut" style="font-size:13.5px">Domínio = questões que você acertou pelo menos 2 vezes seguidas.</p>
   <div class="row"><button class="btn sec" onclick="go('home')">← Voltar</button><div class="sp"></div><button class="btn sec" style="color:var(--bad)" onclick="if(confirm('Apagar TODO o progresso?')){try{localStorage.removeItem(KEY)}catch(e){}; S=load(); save(); go('home')}">Resetar progresso</button></div></div>`);
}

// teclado: 1-4 / a-d para responder, Enter para continuar
document.addEventListener("keydown", e=>{
  if (!SES || SES.mode==="exam") return;
  const m = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[e.key.toLowerCase()];
  if (m!==undefined && !SES.answered && $("o"+m)) answer(m);
  else if (e.key==="Enter" && $("nextBtn")) { e.preventDefault(); nextQ(); }
});

topbar(); checkAch(); home();

</script>
