<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTFL Quest — Treino para a prova CTFL 4.0</title>
<style>
:root{--bg:#0f1226;--bg2:#171b36;--card:#1e2346;--card2:#262c57;--txt:#eef0ff;--mut:#9aa2d6;--pri:#7c5cff;--pri2:#a58bff;--ok:#2ecc8f;--bad:#ff5d73;--warn:#ffc24b;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a2170 0%,transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px;cursor:pointer}
.logo span{color:var(--pri2)}
.pill{background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.sp{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hero{background:linear-gradient(135deg,#3b2aa8,#7c5cff 60%,#b06cff);position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:22px}
.hero .lv{font-size:14px;opacity:.9}
.bar{height:12px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ffb84b);border-radius:99px;transition:width .6s}
.bar.g>i{background:linear-gradient(90deg,#2ecc8f,#5ff0b5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;transition:transform .12s,background .12s;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile:hover{transform:translateY(-3px);background:var(--card2)}
.tile .ic{font-size:28px}
.tile b{font-size:16px}
.tile small{color:var(--mut);font-size:13px;line-height:1.35}
.tile.big{grid-column:1/-1;background:linear-gradient(135deg,#1f6f5a,#2ecc8f);min-height:auto;flex-direction:row;align-items:center;gap:14px}
.tile.big .ic{font-size:38px}
.tile.big small{color:#e6fff5}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
h3{margin:18px 0 10px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.chap{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.chap:hover{background:var(--card2)}
.chap .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--card2);flex:none}
.chap .info{flex:1}
.chap .info small{color:var(--mut)}
.stars{color:var(--warn);letter-spacing:2px}
.btn{background:var(--pri);padding:12px 18px;border-radius:12px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--card2)}
.btn.ok{background:var(--ok);color:#06281c}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px}
.tabs button.on{background:var(--pri)}
.lesson{font-size:16px;line-height:1.55}
.lesson h4{margin:0 0 8px;font-size:18px;color:var(--pri2)}
.trap{background:#3a1f2c;border-left:4px solid var(--bad);padding:10px 12px;border-radius:10px;margin:8px 0;font-size:15px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.hearts{font-size:18px;letter-spacing:2px}
.qtext{font-size:17px;line-height:1.5;margin-bottom:14px}
.qtext pre{background:#0b0e20;padding:10px;border-radius:10px;overflow:auto;font-size:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);padding:13px 14px;border-radius:12px;margin-bottom:9px;font-size:15.5px;line-height:1.4;border:2px solid transparent;transition:background .12s}
.opt:hover:not(:disabled){background:#313873}
.opt .l{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.1);margin-right:10px;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--pri2)}
.opt.ok{background:#15543f;border-color:var(--ok)}
.opt.bad{background:#5a1e2a;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px;margin-top:6px;font-size:15.5px;line-height:1.5}
.fb.ok{background:#123f31}
.fb.bad{background:#46182a}
.fb b{display:block;margin-bottom:4px;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.tag.w{background:#5a3a12;color:#ffd48a}
.tb{border-collapse:collapse;margin:8px 0;font-size:13.5px;width:100%;overflow:auto;display:block}
.tb td,.tb th{border:1px solid #3a4180;padding:4px 7px;text-align:center}
.tb th{background:#2b3166}
.dg{width:100%;max-width:420px;display:block;margin:8px auto 14px;color:#cfd4ff;background:#0b0e20;border-radius:12px;padding:10px}
.dg .bx rect,.dg .st circle{fill:#1e2346;stroke:#cfd4ff}
.flash{perspective:1000px;height:230px;cursor:pointer;margin-bottom:12px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:grid;place-items:center;padding:24px;text-align:center}
.flash .f{background:linear-gradient(135deg,#3b2aa8,#7c5cff);font-size:26px;font-weight:800}
.flash .b{background:var(--card2);transform:rotateY(180deg);font-size:18px;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cats button{background:var(--card2);padding:12px;border-radius:12px;font-size:14.5px;font-weight:600}
.cats button:hover{background:#313873}
.cats button.ok{background:#15543f}.cats button.bad{background:#5a1e2a}
.item{font-size:18px;line-height:1.45;background:var(--card2);padding:18px;border-radius:14px;margin-bottom:12px;min-height:80px}
.center{text-align:center}
.big{font-size:44px;font-weight:800;margin:6px 0}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--card2);margin-bottom:8px}
.ach.off{opacity:.38;filter:grayscale(1)}
.ach .e{font-size:28px}
.ach small{color:var(--mut)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#2b2166;border:1px solid var(--pri2);padding:12px 18px;border-radius:14px;z-index:99;transition:transform .35s;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.xpfly{position:fixed;font-weight:800;color:#ffe066;pointer-events:none;animation:fly 1s ease-out forwards;z-index:98;font-size:20px}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.conf{position:fixed;top:-20px;font-size:22px;animation:fall 2.2s linear forwards;z-index:97;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.nav button{width:34px;height:34px;border-radius:8px;background:var(--card2);font-size:13px}
.nav button.ans{background:#3b3a8a}.nav button.cur{outline:2px solid var(--pri2)}
.nav button.ok{background:#15543f}.nav button.bad{background:#5a1e2a}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2b3166;font-size:15px}
.mut{color:var(--mut)}
.combo{color:var(--warn);font-weight:800}
a{color:var(--pri2)}
@media(max-width:520px){.qtext{font-size:16px}.opt{font-size:15px}.grid{grid-template-columns:1fr 1fr}.tile{min-height:110px;padding:13px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div class="logo" onclick="go('home')">🎯 CTFL <span>Quest</span></div>
  <div class="sp"></div>
  <div class="pill" title="Dias seguidos estudando">🔥 <b id="tStreak">0</b></div>
  <div class="pill" title="Experiência">⭐ <b id="tXp">0</b></div>
 </div>
 <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
// ===== BANCO DE QUESTÕES — parte 1 (Capítulo 1 e 2) =====
// a = índice da correta (0=a,1=b,2=c,3=d) | w = você errou essa no seu simulado
const Q = [];
const add = (o) => Q.push(o);

// ---------- Capítulo 1 - Simulado 2 ----------
add({id:"c1-1",ch:1,src:"Cap. 1 – Simulado 2",q:"Qual das opções abaixo NÃO representa um objetivo típico do teste de software?",o:["Verificar se um objeto de teste está em conformidade com requisitos legais ou contratuais.","Aumentar a complexidade do código para torná-lo mais desafiador de testar.","Avaliar produtos de trabalho, como requisitos (histórias de usuário) e código.","Fornecer informações para apoiar decisões sobre liberação de versões."],a:1,e:"Teste existe para achar problemas e dar informação. Deixar o código mais complicado de propósito não faz sentido nenhum — é a alternativa 'absurda'."});
add({id:"c1-2",ch:1,src:"Cap. 1 – Simulado 2",q:"Uma falha foi observada: ao adicionar um item ao carrinho, o total não atualizava. A equipe usou uma ferramenta para acompanhar o código passo a passo e ver as variáveis. Qual alternativa está CORRETA sobre teste e depuração?",o:["O teste tem como objetivo principal corrigir os defeitos encontrados.","A depuração serve para planejar e controlar a execução dos testes.","O teste revela falhas; a depuração encontra, analisa e elimina os defeitos que causaram essas falhas.","A depuração é feita antes dos testes para evitar falhas."],a:2,e:"Teste = MOSTRA que algo está errado. Depuração = ACHA e CONSERTA a causa. Quem testa aponta, quem depura conserta."});
add({id:"c1-3",ch:1,src:"Cap. 1 – Simulado 2",q:"Quais são as principais contribuições dos testes para o sucesso do projeto?",o:["Garantir que todos os defeitos sejam corrigidos no desenvolvimento.","Substituir completamente a participação dos usuários.","Contribuir para decisões de projeto, representar indiretamente os usuários e atender requisitos contratuais ou regulatórios.","Eliminar a necessidade de depuração e garantir conformidade com marketing."],a:2,e:"Palavras como 'garantir TODOS', 'substituir completamente', 'eliminar' são quase sempre erradas. Teste ajuda a decidir, representa o usuário e cobre exigências legais."});
add({id:"c1-4",ch:1,src:"Cap. 1 – Simulado 2",q:"Qual a explicação mais adequada para a diferença entre Teste, Garantia da Qualidade (QA) e Controle de Qualidade (QC)?",o:["Teste é uma forma de QC; QC é corretivo e orientado ao produto; QA é preventivo e orientado ao processo.","Teste é uma forma de QA; QC é corretivo e orientado ao produto; QA é preventivo e orientado ao processo.","Teste é uma forma de QA; QC é preventivo e orientado ao processo; QA é corretivo e orientado ao produto.","Teste, QC e QA são sinônimos."],a:0,e:"Macete: QC = Conserta o produto (Corretivo). QA = Antecipa no processo (preventivo). E TESTE mora dentro do QC."});
add({id:"c1-5",ch:1,src:"Cap. 1 – Simulado 2",w:1,q:"O sistema permitia compras com cartão vencido. A verificação de validade não foi implementada porque o desenvolvedor assumiu que outro sistema faria isso. Qual alternativa está CORRETA?",o:["O defeito é o resultado observado: o sistema permitia compras com cartão vencido.","A falha é a falta de verificação da validade no código.","O erro é o testador fazer um teste que não estava previsto.","A causa-raiz é a suposição do desenvolvedor de que outro sistema faria a verificação."],a:3,e:"Cadeia: causa-raiz (a suposição) → erro humano → defeito (falta no código) → falha (o que se VÊ: compra aprovada). O que o testador observa é FALHA, não defeito."});
add({id:"c1-6",ch:1,src:"Cap. 1 – Simulado 2",q:"Ao inserir 1200,50 (com vírgula) o cálculo de juros saía errado. O desenvolvedor assumiu o formato americano (ponto decimal). O que é o ERRO?",o:["O resultado incorreto no cálculo de juros.","O desenvolvedor que assumiu o formato americano na rotina de cálculo.","A implementação do formato americano no código.","O testador inserindo um valor com vírgula."],a:1,e:"ERRO = ação HUMANA (a pessoa se enganou). Código errado = defeito. Resultado errado na tela = falha."});
add({id:"c1-7",ch:1,src:"Cap. 1 – Simulado 2",q:"Um membro sugere testar todas as combinações possíveis de entrada para garantir qualidade total. Como avaliar?",o:["É viável se houver tempo.","É recomendado, principalmente em sistemas críticos.","Não é recomendado: testar todas as combinações é inviável na maioria dos contextos.","É viável se automatizar tudo."],a:2,e:"Princípio 2: testes exaustivos são impossíveis (exceto casos triviais). Nem com automação."});
add({id:"c1-8",ch:1,src:"Cap. 1 – Simulado 2",q:"Um gerente diz: 'os testes passaram sem falhas, então o sistema está 100% livre de defeitos'. Como responder?",o:["Concordar.","Explicar que os testes aumentam a confiança, mas nunca provam ausência total de defeitos.","Dizer que ausência de falhas garante aprovação.","Dizer que é preciso reexecutar tudo."],a:1,e:"Princípio 1: o teste mostra a PRESENÇA de defeitos, não a ausência."});
add({id:"c1-9",ch:1,src:"Cap. 1 – Simulado 2",w:1,q:"No início do processo, a equipe discute os riscos do produto, suas probabilidades, impactos e formas de mitigação. Em qual grupo de atividades ela está?",o:["Planejamento do teste.","Análise de teste.","Modelagem de teste.","Monitoramento e controle de teste."],a:0,e:"Levantar riscos + probabilidade + impacto + mitigação para decidir a abordagem = PLANEJAMENTO. (A Análise prioriza condições de teste, não monta o registro de riscos do plano.)"});
add({id:"c1-10",ch:1,src:"Cap. 1 – Simulado 2",q:"Qual ação pertence ao grupo de IMPLEMENTAÇÃO dos testes?",o:["Avaliar a cobertura com base nos riscos e decidir a liberação.","Executar sessões exploratórias e testes automatizados.","Organizar os casos de teste em procedimentos de teste e reunir em conjuntos de teste.","Registrar defeitos e atualizar a situação dos casos."],a:2,e:"Implementação = deixar tudo PRONTO para rodar: procedimentos, scripts, conjuntos (suítes), dados, ambiente, cronograma de execução."});
add({id:"c1-11",ch:1,src:"Cap. 1 – Simulado 2",q:"Uma empresa tem um sistema bancário crítico e um app de entretenimento, e usa processos de teste diferentes para cada um. Qual fator justifica isso?",o:["Restrições de tempo e orçamento.","Disponibilidade de ferramentas.","A criticidade e os riscos de cada projeto.","O tamanho da equipe."],a:2,e:"Princípio 6: o teste depende do contexto. O cenário fala de 'crítico' vs 'entretenimento' → risco/criticidade."});
add({id:"c1-12",ch:1,src:"Cap. 1 – Simulado 2",q:"Numa auditoria pediram os artefatos de teste e o gerente entregou só os scripts automatizados. Qual a falha segundo a definição de testware?",o:["Faltaram os scripts manuais.","Testware inclui só registros e relatórios de defeitos.","Testware é só as ferramentas.","Testware inclui TODOS os produtos de trabalho do processo de teste: plano, condições, casos, dados, scripts etc."],a:3,e:"Testware = tudo que o processo de teste produz. Não é só script."});
add({id:"c1-13",ch:1,src:"Cap. 1 – Simulado 2",w:1,q:"A equipe está na ANÁLISE de teste, entendendo o que precisa ser testado a partir da base de teste. Qual testware é típico desse grupo?",o:["Relatório de defeitos com status de correção.","Lista de condições de teste derivadas dos requisitos.","Casos de teste priorizados, requisitos de ambiente e dados de teste.","Registro de riscos e cronograma."],a:1,e:"Análise = O QUE testar → condições de teste. Modelagem = COMO testar → casos de teste. Grave: Análise→Condições, Modelagem→Casos."});
add({id:"c1-14",ch:1,src:"Cap. 1 – Simulado 2",q:"Qual artefato é um testware gerado na EXECUÇÃO dos testes?",o:["Registro de testes com a situação de cada caso de teste.","Requisitos do usuário da análise de negócios.","Plano de teste.","Matriz de rastreabilidade."],a:0,e:"Execução gera: registros de teste (logs) e relatórios de defeitos."});
add({id:"c1-15",ch:1,src:"Cap. 1 – Simulado 2",q:"Um analista quer verificar se todos os requisitos foram cobertos pelos testes. Qual a principal utilidade da rastreabilidade aqui?",o:["Estimar tempo e custo por requisito.","Medir produtividade do testador.","Verificar se cada requisito está ligado a pelo menos um caso de teste.","Organizar testwares em fluxos."],a:2,e:"Rastreabilidade = ligar requisito ↔ teste. Serve para avaliar cobertura e impacto de mudanças."});
add({id:"c1-16",ch:1,src:"Cap. 1 – Simulado 2",q:"Em uma equipe ágil, qual afirmação descreve CORRETAMENTE os papéis no teste?",o:["Só testadores podem fazer atividades de teste.","Desenvolvedores não devem participar dos testes.","Pessoas diferentes podem assumir os papéis de teste: testadores, desenvolvedores e outros stakeholders.","O gerente de projeto é o único responsável."],a:2,e:"Papel ≠ cargo. Qualquer pessoa pode assumir o papel de teste em momentos diferentes."});
add({id:"c1-17",ch:1,src:"Cap. 1 – Simulado 2",q:"Um testador percebe que a falha só ocorre quando o assento é escolhido antes da classe, levanta uma hipótese sobre a ordem dos eventos e propõe um novo fluxo para confirmar. Que habilidade é essa?",o:["Comunicação clara.","Pensamento analítico, organizando causa e efeito.","Atenção a métricas de cobertura.","Priorizar por risco."],a:1,e:"Hipótese + causa e efeito = pensamento analítico."});
add({id:"c1-18",ch:1,src:"Cap. 1 – Simulado 2",q:"Desde o início, testadores, devs, analistas de negócio e usuários colaboram. Qual benefício está alinhado à abordagem da equipe completa?",o:["Testes só por especialistas.","Achar defeitos só no final.","Compartilhar a responsabilidade pela qualidade entre todos.","Terceirizar os testes."],a:2,e:"Equipe completa (whole team) = qualidade é responsabilidade de TODOS."});
add({id:"c1-19",ch:1,src:"Cap. 1 – Simulado 2",q:"A equipe de teste participa desde o refinamento de requisitos, achando ambiguidades antes da codificação. Isso é exemplo de:",o:["Contribuição proativa dos testadores para a prevenção de defeitos.","Independência dos testes.","Participação tardia.","Isolamento da equipe de teste."],a:0,e:"Entrar cedo e evitar defeitos = prevenção + equipe completa."});
add({id:"c1-20",ch:1,src:"Cap. 1 – Simulado 2",q:"A mesma equipe projeta, codifica e testa. Vários defeitos só apareceram depois da entrega. Qual limitação da falta de independência isso mostra?",o:["Menor produtividade dos devs.","Possível viés na execução e avaliação dos testes.","Dificuldade de rastreabilidade.","Falta de ferramentas."],a:1,e:"Quem fez tende a não enxergar os próprios erros (viés cognitivo). Por isso um certo grau de independência ajuda a achar defeitos."});

// ---------- Capítulo 1 - Princípios de Teste ----------
const P7 = ["1 - O teste mostra a presença, não a ausência de defeitos","2 - Testes exaustivos são impossíveis","3 - Testes antecipados economizam tempo e dinheiro","4 - Os defeitos se agrupam","5 - Os testes se degradam","6 - Os testes dependem do contexto","7 - Falácia da ausência de defeitos"];
add({id:"pr-1",ch:1,src:"Cap. 1 – Princípios",q:"Uma empresa só começa a testar depois que a codificação termina. Defeitos graves apareceram no fim, gerando retrabalho e atraso. Qual princípio não está sendo seguido?",o:P7,a:2,e:"Testar só no fim = caro. Testar cedo (shift-left) economiza."});
add({id:"pr-2",ch:1,src:"Cap. 1 – Princípios",q:"A equipe diz: 'todos os testes passaram, então o app está livre de defeitos e pronto'. Qual princípio explica o erro dessa conclusão?",o:P7,a:0,e:"Passar nos testes não prova que não há defeitos. O teste só mostra que eles EXISTEM quando os encontra."});
add({id:"pr-3",ch:1,src:"Cap. 1 – Princípios",q:"O sistema passou em 100% dos testes, mas os usuários acham difícil de usar e ineficiente. O gerente diz que não há defeitos. Qual princípio ele desconhece?",o:P7,a:6,e:"Falácia da ausência de defeitos: estar sem defeitos não adianta se o sistema não atende o que o usuário precisa (verificação ≠ validação)."});
add({id:"pr-4",ch:1,src:"Cap. 1 – Princípios",q:"O cliente exige testar TODAS as combinações de origem, destino, datas, horários, passageiros e pagamento. Qual princípio usar para não aceitar?",o:P7,a:1,e:"Impossível testar tudo. Use técnicas para cobrir mais com menos."});
add({id:"pr-5",ch:1,src:"Cap. 1 – Princípios",q:"Um app bancário e um jogo infantil têm estratégias de teste diferentes. O gerente pergunta por que não usar os mesmos critérios. Qual princípio ele desconhece?",o:P7,a:5,e:"Cada projeto tem seu contexto e risco."});
add({id:"pr-6",ch:1,src:"Cap. 1 – Princípios",q:"Uma suíte automatizada continua igual desde o início, apesar do sistema ter evoluído. Os testes passam, mas defeitos escapam. Qual princípio explica?",o:P7,a:4,e:"Testes repetidos sem atualização param de achar defeitos novos (antigo 'paradoxo do pesticida')."});
add({id:"pr-7",ch:1,src:"Cap. 1 – Princípios",q:"A maioria dos defeitos se concentrou no módulo de reabastecimento automático e continuam surgindo ali. Qual princípio?",o:P7,a:3,e:"Pareto 80/20: poucos módulos concentram a maioria dos defeitos."});
add({id:"pr-8",ch:1,src:"Cap. 1 – Princípios",w:1,q:"Num ciclo de regressão, os mesmos testes automatizados, executados repetidamente, deixaram de encontrar novos defeitos apesar das mudanças no sistema. Qual princípio?",o:P7,a:4,e:"'Mesmos testes repetidos' + 'não acham mais nada' = os testes se degradam. Não confunda com o princípio 1."});
add({id:"pr-9",ch:1,src:"Cap. 1 – Princípios",q:"Os testes começaram na fase de requisitos, com revisões de documentos. Qual princípio está sendo aplicado?",o:P7,a:2,e:"Revisar documentos cedo = teste antecipado (shift-left)."});
add({id:"pr-10",ch:1,src:"Cap. 1 – Princípios",q:"Nos testes exploratórios você achou muitos defeitos em um módulo e decidiu testar mais ele. Qual princípio?",o:P7,a:3,e:"Onde tem um defeito, costuma ter mais. Defeitos se agrupam."});

// ---------- Capítulo 2 - Simulado 2 ----------
add({id:"c2-1",ch:2,src:"Cap. 2 – Simulado 2",w:1,q:"Em um projeto com modelo SEQUENCIAL, como o modelo influencia o início das atividades de teste?",o:["Testes dinâmicos começam logo após os requisitos.","Testes estáticos podem ser feitos desde as fases iniciais do ciclo de vida.","O modelo impede qualquer teste antes da codificação.","Todos os testes só após a implantação."],a:1,e:"No cascata não há código executável no começo → nada de teste dinâmico cedo. Mas revisões (teste ESTÁTICO) dá para fazer desde os requisitos."});
add({id:"c2-2",ch:2,src:"Cap. 2 – Simulado 2",q:"Qual é INCORRETA sobre boas práticas de teste, independentemente do SDLC?",o:["Para cada atividade de desenvolvimento há uma atividade de teste correspondente.","Análise e modelagem de teste de um nível começam na fase de desenvolvimento correspondente.","Os testadores só entram após a codificação, para evitar retrabalho e reduzir custo.","Níveis diferentes têm objetivos diferentes, evitando redundância."],a:2,e:"Testador entra CEDO, revisando rascunhos. 'Só depois do código' é o contrário do shift-left."});
add({id:"c2-3",ch:2,src:"Cap. 2 – Simulado 2",q:"Qual a sequência correta do TDD?",o:["Escrever testes → executar (FALHA) → escrever código → executar (SUCESSO) → refatorar.","Escrever código → escrever testes → executar → refatorar.","Escrever testes → executar (FALHA) → escrever código → refatorar.","Escrever código → testes (FALHA) → refatorar → executar."],a:0,e:"Vermelho → Verde → Refatora. O teste vem ANTES e falha primeiro."});
add({id:"c2-4",ch:2,src:"Cap. 2 – Simulado 2",q:"Relacione: (1) TDD (2) ATDD (3) BDD com (A) testes de aceite definidos antes, a partir dos critérios de aceite, com negócio+dev+teste; (B) desenvolvimento guiado por testes automatizados que falham primeiro; (C) comportamento descrito em linguagem natural 'Dado/Quando/Então'.",o:["1B, 2A, 3C","1C, 2B, 3A","1A, 2C, 3B","1B, 2C, 3A"],a:0,e:"TDD = teste de código (unidade). ATDD = critérios de Aceite. BDD = Comportamento em Dado/Quando/Então."});
add({id:"c2-5",ch:2,src:"Cap. 2 – Simulado 2",q:"Qual afirmação melhor descreve o teste em DevOps?",o:["Testes principalmente após a integração contínua.","Só testadores dedicados testam, antes da entrega.","Testes automatizados e integrados ao pipeline de entrega contínua, com feedback rápido.","Testes são evitados para acelerar."],a:2,e:"DevOps = pipeline CI/CD com testes automatizados dando feedback rápido."});
add({id:"c2-6",ch:2,src:"Cap. 2 – Simulado 2",q:"São vantagens do DevOps? (S/N)<br>I) Lançamento mais rápido.<br>II) Aumenta testes manuais repetitivos.<br>III) Software executável sempre disponível.<br>IV) Reduz testes de regressão por refatoração.<br>V) Montar a automação é barato.",o:["S, S, N, S, N","N, N, S, N, S","N, S, N, S, S","S, N, S, N, N"],a:3,e:"Vantagens: rápido e sempre executável. Desvantagens/riscos: precisa de MAIS regressão e montar automação é CARO."});
add({id:"c2-7",ch:2,src:"Cap. 2 – Simulado 2",q:"Muitos defeitos só apareciam no teste de aceite, perto da entrega. Qual ação alinha a equipe ao Shift-Left?",o:["Concentrar testes na homologação ao final.","Adiar automação.","Integrar teste desde o início: revisar requisitos e escrever casos antes do código.","Reduzir testadores no início."],a:2,e:"Shift-left = empurrar o teste para a ESQUERDA da linha do tempo (mais cedo)."});
add({id:"c2-8",ch:2,src:"Cap. 2 – Simulado 2",q:"Na retrospectiva, a equipe discute problemas de comunicação e atrasos nos testes. Qual ação combina com o objetivo da retrospectiva?",o:["Adiar a retrospectiva.","Identificar causas e propor ações para melhorar o processo, incluindo os testes.","Focar só no código.","Avaliar desempenho individual e punir."],a:1,e:"Retrospectiva = o que foi bem, o que melhorar, ações concretas. Não é tribunal."});
add({id:"c2-9",ch:2,src:"Cap. 2 – Simulado 2",q:"A equipe verifica se login e controle de acesso funcionam juntos com o banco de dados e o serviço de autenticação externo, buscando falhas nas interfaces. Qual nível?",o:["Unidade/componente.","Integração.","Sistema.","Aceite."],a:1,e:"Palavras-chave 'interfaces', 'interação', 'funcionam em conjunto' = integração."});
add({id:"c2-10",ch:2,src:"Cap. 2 – Simulado 2",q:"Um programador cria testes automatizados para validar se a função de desconto retorna os valores esperados. Qual nível?",o:["Unidade ou componente.","Integração de componentes.","Sistema.","Aceite."],a:0,e:"Uma função isolada, feita pelo dev = componente (unidade)."});
add({id:"c2-11",ch:2,src:"Cap. 2 – Simulado 2",q:"O testador verifica se a transferência responde corretamente a diferentes combinações de entrada. Qual tipo de teste?",o:["Funcional.","Não funcional.","Confirmação.","Manutenção."],a:0,e:"'O QUE o sistema faz' (resultado certo) = funcional. 'COMO faz' (rápido, usável, seguro) = não funcional."});
add({id:"c2-12",ch:2,src:"Cap. 2 – Simulado 2",q:"Após corrigir um defeito, a equipe roda testes na função corrigida e depois em funções relacionadas para ver se nada quebrou. Quais tipos?",o:["Regressão seguido de funcional.","Confirmação seguido de não funcional.","Não funcional seguido de confirmação.","Confirmação seguido de regressão."],a:3,e:"Confirmação = 'o defeito sumiu?'. Regressão = 'quebrei outra coisa?'."});
add({id:"c2-13",ch:2,src:"Cap. 2 – Simulado 2",w:1,q:"Requisito: 'o processamento de um pedido não deve exceder 10 segundos em 95% das tentativas'. O testador mediu tempos e comparou. Qual tipo de teste?",o:["Funcional, pois é experiência do usuário.","Não funcional, pois avalia eficiência de desempenho (tempo de resposta).","Caixa-preta, pois valida se pedidos são processados.","Caixa-branca, pois depende da lógica interna."],a:1,e:"Tempo, velocidade, carga = eficiência de desempenho = NÃO funcional. Pense 'quão bem', não 'o quê'."});
add({id:"c2-14",ch:2,src:"Cap. 2 – Simulado 2",q:"Uma plataforma vai para nova versão do sistema operacional e integra uma biblioteca nova; outra equipe desliga um módulo legado. Quais fatores de manutenção estão presentes?",o:["Correção e atualização.","Modificação e verificação.","Melhoria e modificação.","Migração e aposentadoria."],a:3,e:"Mudar de plataforma = migração. Desligar módulo = aposentadoria. Gatilhos de manutenção: modificação, migração (atualização de ambiente) e aposentadoria."});
// ===== BANCO DE QUESTÕES — parte 2 (Capítulo 3 e 4) =====
// ---------- Capítulo 3 - Simulado 2 ----------
add({id:"c3-1",ch:3,src:"Cap. 3 – Simulado 2",q:"Qual produto de trabalho NÃO pode ser examinado por testes estáticos?",o:["Especificação de requisitos (histórias de usuário).","Cartas de teste exploratório.","Documentação do projeto, contratos e modelos.","Código executável de terceiros."],a:3,e:"Estático = LER sem executar. Quase tudo pode ser lido/revisado, menos um executável (binário) de terceiros — esse só dá pra testar rodando."});
add({id:"c3-2",ch:3,src:"Cap. 3 – Simulado 2",q:"Numa revisão de requisitos no início do projeto, um testador achou inconsistências nas regras de negócio. Qual o valor do teste estático aqui?",o:["Detecção precoce de defeitos e menor esforço geral de desenvolvimento.","Eliminação completa de defeitos.","Melhoria da usabilidade.","Eliminar todos os defeitos no aceite."],a:0,e:"Achar cedo = mais barato. 'Eliminar todos' é sempre errado."});
add({id:"c3-3",ch:3,src:"Cap. 3 – Simulado 2",q:"Classifique:<br>I. Detecta desvios de padrões de codificação.<br>II. Identifica falhas ao executar com entradas específicas.<br>III. Detecta defeitos antes de executar.<br>IV. Identifica comportamentos incorretos durante a execução.<br>V. Detecta cedo requisitos de segurança não cobertos.",o:["Estático: II, IV; Dinâmico: I, III, V.","Estático: I, III, V; Dinâmico: II, IV.","Estático: I, III; Dinâmico: II, IV, V.","Estático: I, II, III; Dinâmico: IV, V."],a:1,e:"Se fala em 'execução', 'falha', 'comportamento' → dinâmico. Se fala em 'padrões', 'antes de executar' → estático."});
add({id:"c3-4",ch:3,src:"Cap. 3 – Simulado 2",q:"Uma organização adotou revisões frequentes com testadores e stakeholders desde o início. Qual o principal benefício do feedback antecipado e frequente?",o:["Execução manual mais rápida.","Menos testes automatizados e licenças.","Comunicação precoce de problemas de qualidade, evitando mal-entendidos sobre requisitos.","Menos testes estáticos."],a:2,e:"Feedback cedo = evita mal-entendido de requisito."});
add({id:"c3-5",ch:3,src:"Cap. 3 – Simulado 2",q:"O revisor comunica anomalias, recomendações e perguntas ao autor, que analisa e discute todos os problemas. Qual atividade do processo de revisão?",o:["Planejamento.","Início da revisão.","Comunicação e análise dos problemas.","Correção e relatório."],a:2,e:"Discutir as anomalias e decidir o que fazer com cada uma = comunicação e análise."});
add({id:"c3-6",ch:3,src:"Cap. 3 – Simulado 2",q:"Relacione as atividades da revisão (1 Planejamento, 2 Início, 3 Revisão individual, 4 Comunicação e análise, 5 Correção e relatório) com:<br>(A) Analisar e discutir anomalias e decidir status/ações.<br>(B) Criar relatório de defeitos para acompanhar correções.<br>(C) Avaliar o produto e identificar anomalias aplicando técnicas de revisão.<br>(D) Definir escopo, objetivo, critérios de saída, esforço e prazos.<br>(E) Garantir que todos estejam preparados para começar.",o:["1A, 2B, 3C, 4D, 5E","1D, 2E, 3C, 4A, 5B","1D, 2E, 3C, 4B, 5A","1E, 2B, 3C, 4D, 5A"],a:1,e:"Ordem natural: Planeja (escopo) → Inicia (todo mundo pronto) → Cada um revisa → Discute → Corrige e reporta."});
add({id:"c3-7",ch:3,src:"Cap. 3 – Simulado 2",q:"Qual função garante o andamento eficaz das reuniões de revisão, media conflitos, gerencia tempo e mantém um ambiente seguro para todos falarem?",o:["Moderador (facilitador).","Gerente.","Líder da revisão.","Revisor."],a:0,e:"Moderador = 'mediador' da reunião. Líder da revisão = responsável geral (quem participa, quando, onde)."});
add({id:"c3-8",ch:3,src:"Cap. 3 – Simulado 2",q:"Um analista escreve os casos de teste e um testador revisa. Não há processo definido nem documento formal de resultado. Qual tipo de revisão?",o:["Inspeção.","Revisão técnica.","Walkthrough.","Revisão informal."],a:3,e:"Sem processo e sem documento = informal."});
add({id:"c3-9",ch:3,src:"Cap. 3 – Simulado 2",q:"Uma instituição financeira auditada precisa revisar requisitos com processo completo, funções definidas e coleta de métricas. Qual tipo?",o:["Inspeção.","Revisão técnica.","Walkthrough.","Revisão informal."],a:0,e:"Mais formal de todas, com métricas = inspeção."});
add({id:"c3-10",ch:3,src:"Cap. 3 – Simulado 2",q:"Qual fator contribui para uma revisão eficaz?",o:["Evitar revisões parciais.","Usar moderadores/facilitadores nas reuniões, sempre que possível.","Dar feedback só ao autor.","Permitir interrupções constantes."],a:1,e:"Fatores de sucesso: objetivos claros, partes pequenas, tempo adequado, facilitação, feedback para todos, ambiente seguro."});

// ---------- Capítulo 4 - Simulado 2 ----------
add({id:"c4-1",ch:4,src:"Cap. 4 – Simulado 2",q:"Qual o propósito de usar diferentes técnicas de teste na análise e modelagem?",o:["Escolher a técnica mais fácil.","Garantir repetibilidade e eliminar defeitos rápido.","Ter uma abordagem sistemática para criar um conjunto pequeno, mas suficiente, de casos de teste.","Só documentar para auditoria."],a:2,e:"Técnica = jeito organizado de testar MUITO com POUCOS casos."});
add({id:"c4-2",ch:4,src:"Cap. 4 – Simulado 2",q:"Aluguel de carro por idade: Jovem 18–24, Padrão 25–60, Sênior 61–80; abaixo de 18 ou acima de 80 = rejeita. Qual conjunto dá a MELHOR cobertura de particionamento de equivalência?",o:["18, 24, 25, 60, 61, 80","20, 25, 50, 70, 80","18, 26, 61, 80, 85","15, 22, 55, 75, 85"],a:3,e:"São 5 partições: <18 | 18–24 | 25–60 | 61–80 | >80. Precisa de 1 valor em CADA uma. Só a (d) cobre todas (15, 22, 55, 75, 85)."});
add({id:"c4-3",ch:4,src:"Cap. 4 – Simulado 2",q:"Voltagem nominal 110V com tolerância de 5% para cima e para baixo. Usando BVA de 2 pontos e variação de 0,1V, quais valores testar?",o:["104,4V, 104,5V, 115,5V e 115,6V","104V, 105V, 115V e 116V","100V, 110V e 120V","104,4V, 104,5V, 110V, 115,5V e 115,6V"],a:0,e:"5% de 110 = 5,5 → faixa 104,5 a 115,5. BVA 2 pontos = o limite + o vizinho de fora: 104,4 | 104,5 e 115,5 | 115,6."});
add({id:"c4-4",ch:4,src:"Cap. 4 – Simulado 2",q:"Mesma rede (110V ± 5%, variação 0,1V). Agora com BVA de 3 pontos, quais valores?",o:["104,4V, 104,5V, 115,5V e 115,6V","104,5V, 110V e 115,5V","104,4V, 104,5V, 104,6V, 115,4V, 115,5V e 115,6V","104,3V, 104,5V, 104,7V, 115,3V, 115,5V e 115,7V"],a:2,e:"BVA 3 pontos = vizinho antes + limite + vizinho depois, em cada limite. 3 × 2 limites = 6 valores."});
add({id:"c4-5",ch:4,src:"Cap. 4 – Simulado 2",q:"Regra: acesso permitido SOMENTE se o usuário tiver 18+ E cadastro válido. Qual combinação mostra uma decisão INCORRETA do sistema?",o:["18+ e cadastro válido → permitido","18+ e cadastro inválido → permitido","Menor de 18 e cadastro válido → negado","Menor de 18 e cadastro inválido → negado"],a:1,e:"Com 'E', basta uma condição falsa para negar. Cadastro inválido tinha que ser NEGADO."});
add({id:"c4-6",ch:4,src:"Cap. 4 – Simulado 2",w:1,img:"estadosAG",q:"Um caso de teste percorre: Estado A → B → C → G → C → B → A. Qual a cobertura de TODOS OS ESTADOS? (arredonde)",o:["20%","30%","40%","60%"],a:3,e:"Conte estados DIFERENTES visitados: A, B, C, G = 4. Total no diagrama: 7 (A a G). 4/7 ≈ 57% → 60%."});
add({id:"c4-7",ch:4,src:"Cap. 4 – Simulado 2",img:"estadosAF",q:"Qual o número mínimo de casos de teste para cobrir todas as transições válidas, começando e terminando em A?",o:["2","3","4","5"],a:2,e:"Cada volta a A encerra o caso. Precisa: A→A | A→B→C→A | A→B→C→D→A | A→B→C→D→F→A = 4."});
add({id:"c4-8",ch:4,src:"Cap. 4 – Simulado 2",w:1,q:"Tabela de estados (login):<br><table class='tb'><tr><th>Estado</th><th>Evento</th><th>Condição</th><th>Vai para</th></tr><tr><td>Desconectado</td><td>Login</td><td>Sucesso</td><td>Logado</td></tr><tr><td>Desconectado</td><td>Login</td><td>Falha</td><td>Desconectado</td></tr><tr><td>Logado</td><td>Logout</td><td>–</td><td>Desconectado</td></tr><tr><td>(*) Logado</td><td>Login</td><td>–</td><td>Logado</td></tr><tr><td>(*) Desconectado</td><td>Logout</td><td>–</td><td>Desconectado</td></tr></table>(*) = transição inválida.<br>Caso de teste a partir de Desconectado: 1) Login sucesso 2) Logout 3) Login falha 4) Logout (inválido). Qual a cobertura de TODAS as transições?",o:["100%","80%","60%","40%"],a:1,e:"'Todas as transições' conta válidas + inválidas = 5. O caso passou por 4 (sucesso, logout, falha, logout inválido). Faltou 'login estando logado'. 4/5 = 80%."});
add({id:"c4-9",ch:4,src:"Cap. 4 – Simulado 2",w:1,img:"fluxoAJ",q:"Um caso de teste percorreu A-B-C-D-E-F. Qual a cobertura de INSTRUÇÃO?",o:["30%","40%","50%","60%"],a:3,e:"Cada caixa = 1 instrução. São 10 (A até J). Visitou 6 (A, B, C, D, E, F). 6/10 = 60%."});
add({id:"c4-10",ch:4,src:"Cap. 4 – Simulado 2",w:1,img:"fluxoAJ",q:"O mesmo caso A-B-C-D-E-F. Qual a cobertura de RAMIFICAÇÃO (decisão)?",o:["30%","40%","50%","60%"],a:2,e:"Ramificações = saídas das caixas que têm 2 caminhos. B→C, B→I, C→D, C→G = 4. O caso usou B→C e C→D = 2. 2/4 = 50%."});
add({id:"c4-11",ch:4,src:"Cap. 4 – Simulado 2",q:"<pre>contador = 0\nread contador\nif contador >= 0\n   print(\"maior ou igual a zero\")\nendif</pre>Quantos casos para 100% de cobertura de INSTRUÇÃO?",o:["1","2","3","4"],a:0,e:"Um valor ≥ 0 passa por todas as linhas. 1 caso basta."});
add({id:"c4-12",ch:4,src:"Cap. 4 – Simulado 2",q:"Mesmo código (if contador >= 0 ... endif). Quantos casos para 100% de cobertura de RAMIFICAÇÃO?",o:["1","2","3","4"],a:1,e:"Precisa ir pelo 'sim' (≥0) e pelo 'não' (negativo) do if = 2 casos."});
add({id:"c4-13",ch:4,src:"Cap. 4 – Simulado 2",q:"Especificação ambígua e incompleta; a equipe usa teste caixa-branca. Qual um ponto forte e um ponto fraco da caixa-branca?",o:["Forte: detecta requisitos não implementados. Fraco: considera só parte da implementação.","Forte: acha defeitos mesmo com especificação vaga. Fraco: pode não detectar requisitos que não foram implementados.","Forte: valida o usuário final. Fraco: não mede cobertura.","Forte: só teste dinâmico. Fraco: ineficaz para pseudocódigo."],a:1,e:"Caixa-branca olha o CÓDIGO: funciona sem boa especificação, mas não enxerga o que NUNCA foi codificado."});
add({id:"c4-14",ch:4,src:"Cap. 4 – Simulado 2",q:"Testador experiente em segurança cria cenários para entradas e sequências historicamente vulneráveis, onde erros comuns de programação costumam ocorrer. Qual técnica?",o:["Teste exploratório.","Baseado em checklist.","Suposição de erro.","Teste de usabilidade."],a:2,e:"'Por experiência, sei onde costuma dar erro' = suposição de erro (error guessing)."});
add({id:"c4-15",ch:4,src:"Cap. 4 – Simulado 2",q:"Módulo experimental, pouca documentação, prazo curto, o testador precisa aprender rápido e achar defeitos inesperados sem modelagem detalhada. Qual técnica?",o:["Teste exploratório.","Checklist.","Suposição de erro.","Análise de valor limite."],a:0,e:"Pouca documentação + pouco tempo + aprender enquanto testa = exploratório."});
add({id:"c4-16",ch:4,src:"Cap. 4 – Simulado 2",q:"No aceite de um checkout, o testador usa uma lista pré-definida de itens (usabilidade, consistência visual, padrões) vinda de experiência e boas práticas. Qual afirmação descreve essa técnica?",o:["Só serve para regressão.","São roteiros rígidos sem variação.","Exigem conhecimento de programação.","Ajudam a lembrar de verificar aspectos importantes, como guia sistemático."],a:3,e:"Checklist = lembrete organizado do que não pode esquecer."});
add({id:"c4-17",ch:4,src:"Cap. 4 – Simulado 2",q:"Qual o principal benefício da escrita colaborativa de histórias de usuário e critérios de aceite?",o:["Só o negócio cria os testes de aceite.","Entendimento compartilhado entre negócio, desenvolvimento e teste.","Elimina documentação.","Pula o planejamento."],a:1,e:"Escrever junto = todo mundo entende a mesma coisa."});
add({id:"c4-18",ch:4,src:"Cap. 4 – Simulado 2",q:"Qual o propósito dos Critérios de Aceite?",o:["Definir requisitos não funcionais.","Listar bugs conhecidos.","Condições que devem ser satisfeitas para a funcionalidade ser considerada pronta e correta.","Passos de um caso de teste manual."],a:2,e:"Critério de aceite = 'quando isso tudo for verdade, está pronto'."});
add({id:"c4-19",ch:4,src:"Cap. 4 – Simulado 2",q:"No ATDD, quando os testes de aceite são elaborados?",o:["Antes de implementar o código, para guiar o desenvolvimento.","Depois do desenvolvimento e testes de unidade.","Durante os testes de sistema.","Na manutenção."],a:0,e:"ATDD = Acceptance Test DRIVEN → o teste vem antes e guia."});
add({id:"c4-20",ch:4,src:"Cap. 4 – Simulado 2",q:"Quais são os '3C' das histórias de usuário?",o:["Cartão, Conversação e Confirmação.","Cartão, Conversação e Combinação.","Cartão, Comunicação e Confirmação.","Cartão, Comunicação e Combinação."],a:0,e:"Cartão (onde escreve), Conversação (explicação), Confirmação (critérios de aceite). Cuidado: é ConverSAção, não Comunicação."});
// ===== BANCO DE QUESTÕES — parte 3 (Simulado Completo 1) =====
const S1 = "Simulado Completo 1";
add({id:"s1-1",ch:1,sim:1,src:S1,q:"Qual das afirmações descreve um objetivo de teste válido?",o:["Provar que não existem defeitos não corrigidos.","Provar que não haverá falhas em produção.","Reduzir o nível de risco do objeto de teste e aumentar a confiança no nível de qualidade.","Verificar que não existem combinações de entradas não testadas."],a:2,e:"'Provar que não existe' é impossível. Teste reduz risco e aumenta confiança."});
add({id:"s1-2",ch:1,sim:1,src:S1,q:"Qual alternativa mostra atividades de teste que contribuem para o sucesso?",o:["Testadores envolvidos em várias atividades do SDLC ajudam a detectar defeitos nos produtos de trabalho.","Testadores evitam perturbar os devs durante a codificação.","Testadores com usuários finais melhoram relatórios de defeitos na integração.","Testadores certificados fazem casos muito melhores."],a:0,e:"Testador envolvido cedo e em tudo = defeitos achados antes."});
add({id:"s1-3",ch:1,sim:1,src:S1,q:"Nenhuma alteração foi feita nos testes de regressão por várias iterações e nenhum novo defeito de regressão apareceu. O gerente está feliz; você, cético. Qual princípio explica seu ceticismo?",o:["Os testes se degradam.","Falácia da ausência de defeitos.","Os defeitos se agrupam.","Testes exaustivos são impossíveis."],a:0,e:"Mesmos testes repetidos param de achar coisa nova."});
add({id:"s1-4",ch:1,sim:1,src:S1,q:"Na funcionalidade de pagamento de um app de comida, qual atividade é da ANÁLISE de teste?",o:["Estimar que testar a integração levará 8 dias.","Decidir que a equipe deve testar se é possível dividir o pagamento entre vários usuários.","Usar BVA para derivar dados do valor mínimo a pagar.","Analisar diferença entre esperado e real e relatar defeito."],a:1,e:"Decidir O QUE testar = condição de teste = Análise. Estimar = Planejamento. Usar técnica (BVA) = Modelagem. Relatar defeito = Execução."});
add({id:"s1-5",ch:1,sim:1,src:S1,q:"Quais fatores têm influência SIGNIFICATIVA no processo de teste?<br>(i) SDLC (ii) nº de defeitos de projetos anteriores (iii) riscos do produto (iv) novos requisitos regulatórios (v) nº de testadores certificados",o:["i e ii","i, iii e iv","ii, iv e v","iii e v"],a:1,e:"Contexto que pesa: ciclo de vida, riscos e regulamentação. Histórico de defeitos e certificados não mudam o processo em si."});
add({id:"s1-6",ch:1,sim:1,src:S1,q:"Quais DUAS tarefas pertencem PRINCIPALMENTE ao papel de teste?<br>(i) Configurar ambientes de teste (ii) Manter o backlog (iii) Projetar soluções para requisitos (iv) Criar o plano de teste (v) Relatar a cobertura alcançada",o:["i e iv","i e v","iii e iv","ii e iii"],a:1,e:"Papel de TESTE = mão na massa (ambiente, execução, cobertura). Plano de teste = papel de GESTÃO de teste."});
add({id:"s1-7",ch:1,sim:1,src:S1,q:"Quais habilidades são as MAIS importantes de um testador?<br>(i) Conhecimento de domínio (ii) Criar visão do produto (iii) Ser bom membro de equipe (iv) Planejar o trabalho da equipe (v) Pensamento crítico",o:["ii e iv","i, iii e v","i, ii e v","iii e iv"],a:1,e:"Domínio, trabalho em equipe e pensamento crítico. Visão do produto é do negócio; planejar a equipe é do gestor."});
add({id:"s1-8",ch:1,sim:1,src:S1,q:"Como a abordagem de equipe completa aparece entre testadores e representantes de negócio?",o:["Negócio decide a automação.","Testadores ajudam o negócio a definir a estratégia de teste.","Negócio não faz parte da equipe completa.","Testadores ajudam o negócio a criar testes de aceite adequados."],a:3,e:"Testador + negócio = juntos nos testes de aceite."});
add({id:"s1-9",ch:2,sim:1,src:S1,q:"'Para cada atividade do SDLC há uma atividade de teste correspondente.' Em quais modelos isso vale?",o:["Só sequenciais.","Só iterativos.","Só iterativos e incrementais.","Sequenciais, incrementais e iterativos."],a:3,e:"É uma boa prática universal: vale para TODOS."});
add({id:"s1-10",ch:2,sim:1,src:S1,q:"Qual afirmação descreve MELHOR o ATDD?",o:["Critérios de aceite geralmente em Dado/Quando/Então.","Casos criados no teste de componente, orientados ao código.","Testes criados a partir dos critérios de aceite para orientar o desenvolvimento.","Testes baseados no comportamento desejado, fácil de entender."],a:2,e:"(a) e (d) = BDD. (b) = TDD. (c) = ATDD."});
add({id:"s1-11",ch:2,sim:1,src:S1,q:"Qual NÃO é exemplo de Shift-Left?",o:["Revisar requisitos antes de aceitos.","Escrever teste de componente antes do código.","Teste de desempenho de um componente já no teste de componente.","Escrever script de teste antes de configurar o gerenciamento de configuração."],a:3,e:"Script de teste precisa estar sob gerenciamento de configuração. Fazer antes disso não é shift-left, é bagunça."});
add({id:"s1-12",ch:2,sim:1,src:S1,q:"Qual argumento usar para convencer o gerente a fazer retrospectivas ao fim de cada ciclo?",o:["São populares e os clientes gostam.","Economizam dinheiro porque usuários não dão feedback.","As fraquezas identificadas viram lista de tarefas para a melhoria contínua de processos.","Adotam cinco valores como coragem e respeito."],a:2,e:"Retrospectiva = melhoria contínua. (d) fala de valores do XP."});
add({id:"s1-13",ch:2,sim:1,src:S1,q:"Relacione falhas com níveis:<br>1. Sistema se desvia das necessidades de negócio do usuário<br>2. Falhas na comunicação entre componentes<br>3. Falha de lógica em um módulo<br>4. Regras de negócio implementadas errado<br>A. Componente B. Integração de componentes C. Sistema D. Aceite",o:["1D, 2B, 3A, 4C","1D, 2B, 3C, 4A","1B, 2A, 3D, 4C","1C, 2B, 3A, 4D"],a:0,e:"Necessidade do usuário = aceite. Comunicação = integração. Lógica de módulo = componente. Regras de negócio = sistema."});
add({id:"s1-14",ch:2,sim:1,src:S1,q:"TC1 cobre AC1, TC2 cobre AC2, TC3 cobre AC3. Histórico:<br><table class='tb'><tr><th></th><th>Execução 1</th><th>Execução 2</th><th>Execução 3</th></tr><tr><td>TC1</td><td>(1) Falhou</td><td>(4) Aprovado</td><td>(7) Aprovado</td></tr><tr><td>TC2</td><td>(2) Aprovado</td><td>(5) Falhou</td><td>(8) Aprovado</td></tr><tr><td>TC3</td><td>(3) Falhou</td><td>(6) Falhou</td><td>(9) Aprovado</td></tr></table>Os testes são repetidos após correção dos defeitos. Quais foram executados como REGRESSÃO?",o:["Somente 4, 7, 8, 9","Somente 5, 7","Somente 4, 6, 8, 9","Somente 5, 6"],a:1,e:"Se o teste FALHOU antes, a próxima execução é CONFIRMAÇÃO. Se PASSOU antes, a próxima é REGRESSÃO. TC2 passou em (2) → (5) é regressão. TC1 passou em (4) → (7) é regressão."});
add({id:"s1-15",ch:3,sim:1,src:S1,q:"Qual NÃO é um benefício dos testes estáticos?",o:["Gerenciamento de defeitos menos caro por ser fácil detectar defeitos mais tarde no SDLC.","Corrigir defeitos do estático é mais barato que do dinâmico.","Encontrar defeitos de código que o dinâmico não acharia.","Detectar lacunas e inconsistências nos requisitos."],a:0,e:"Achar MAIS TARDE é MAIS caro. A (a) inverte a lógica."});
add({id:"s1-16",ch:3,sim:1,src:S1,q:"Qual é um benefício do feedback antecipado e frequente?",o:["Melhora o processo para projetos futuros.","Obriga clientes a priorizar por risco.","É a única forma de medir qualidade das mudanças.","Ajuda a evitar mal-entendidos de requisitos."],a:3,e:"Resposta clássica: evita mal-entendido de requisito."});
add({id:"s1-17",ch:3,sim:1,src:S1,q:"Revisões com: 1) papel de redator 2) objetivo principal é avaliar qualidade 3) reunião conduzida pelo AUTOR 4) preparação individual 5) relatório gerado. Qual tipo é MAIS provável?",o:["Revisão informal.","Walkthrough.","Revisão técnica.","Inspeção."],a:1,e:"Dica de ouro: AUTOR conduzindo a reunião = WALKTHROUGH. Na inspeção o autor NÃO pode liderar."});
add({id:"s1-18",ch:3,sim:1,src:S1,q:"Qual NÃO é fator de sucesso para revisões?",o:["Tempo adequado para revisar.","Dividir produtos grandes em partes menores.","Evitar comportamentos de tédio ou hostilidade.","As falhas encontradas devem ser reconhecidas, apreciadas e tratadas objetivamente."],a:3,e:"Pegadinha: revisão acha DEFEITOS, não FALHAS (falha só aparece executando)."});
add({id:"s1-19",ch:4,sim:1,src:S1,q:"Qual é característica das técnicas baseadas em experiência?",o:["Casos criados a partir de design detalhado.","Cobertura medida por itens do código.","Dependem muito do conhecimento do testador sobre o software e o domínio.","Casos usados para achar desvios dos requisitos."],a:2,e:"(a)(b) = caixa-branca. (d) = caixa-preta. (c) = experiência."});
add({id:"s1-20",ch:4,sim:1,src:S1,q:"Busca de apartamentos: Andar (térreo; 1º; 2º ou mais) e Jardim (sem; pequeno; grande). Só térreo tem jardim; o formulário bloqueia combinações inválidas. Mínimo de casos para 100% de partições de equivalência?",o:["3","4","5","6"],a:1,e:"Jardim pequeno e grande só existem no térreo → 2 casos com térreo. Faltam 1º e 2º+ (com 'sem jardim') → mais 2. Total 4."});
add({id:"s1-21",ch:4,sim:1,src:S1,w:1,q:"Notas: 0–50 Reprovado | 51–60 Razoável | 61–70 Satisfatório | 71–80 Bom | 81–90 Muito bom | 91–100 Excelente. Casos: 91, 50, 81, 60, 70, 51. Qual a cobertura de BVA de 2 valores?",o:["50%","60%","33,3%","100%"],a:0,e:"Liste os limites: 0, 50, 51, 60, 61, 70, 71, 80, 81, 90, 91, 100 = 12. Os casos acertam 6 deles. 6/12 = 50%."});
add({id:"s1-22",ch:4,sim:1,src:S1,w:1,q:"Aluguel de bicicletas: qualquer um aluga, membros têm 20% de desconto; se atrasar a devolução, perde o desconto; após 15 aluguéis, membros ganham camiseta.<br><table class='tb'><tr><th>Condições</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>R5</th><th>R6</th><th>R7</th><th>R8</th></tr><tr><td>É membro</td><td>T</td><td>T</td><td>T</td><td>T</td><td>F</td><td>F</td><td>F</td><td>F</td></tr><tr><td>Prazo não cumprido</td><td>T</td><td>F</td><td>T</td><td>F</td><td>T</td><td>F</td><td>F</td><td>T</td></tr><tr><td>15º aluguel</td><td>F</td><td>F</td><td>T</td><td>T</td><td>F</td><td>F</td><td>T</td><td>T</td></tr><tr><th>Ações</th><td colspan=8></td></tr><tr><td>20% desconto</td><td></td><td>X</td><td></td><td>X</td><td></td><td></td><td></td><td></td></tr><tr><td>Camiseta</td><td></td><td></td><td>X</td><td>X</td><td></td><td></td><td></td><td>X</td></tr></table>Qual regra descreve uma situação impossível?",o:["R4","R2","R6","R8"],a:3,e:"R8 dá camiseta para quem NÃO é membro. Só membro ganha camiseta → impossível."});
add({id:"s1-23",ch:4,sim:1,src:S1,w:1,img:"init",q:"O sistema começa em INIT e termina em OFF. Qual o NÚMERO MÍNIMO de casos de teste para cobrir todas as transições válidas?",o:["4","2","7","3"],a:3,e:"'test' e 'run' saem do INIT — não cabem no mesmo caso. E há dois 'done' diferentes. TC1: test, done | TC2: run, error, done | TC3: run, pause, resume, pause, done → 3."});
add({id:"s1-24",ch:4,sim:1,src:S1,q:"Sua suíte alcançou 100% de cobertura de instrução. Qual a consequência?",o:["Cada instrução com defeito foi executada ao menos uma vez.","Qualquer suíte maior também terá 100%.","Cada caminho foi executado.","Cada combinação de entrada foi testada."],a:0,e:"100% instrução = toda linha rodou, inclusive as que têm defeito. Não significa todos os caminhos nem todas as entradas."});
add({id:"s1-25",ch:4,sim:1,src:S1,w:1,q:"Qual afirmação NÃO é verdadeira para o teste caixa-branca?",o:["Toda a implementação do software é considerada.","Métricas de cobertura ajudam a criar testes adicionais.","Técnicas caixa-branca podem ser usadas em teste estático.","O teste caixa-branca pode ajudar a identificar lacunas na implementação dos requisitos."],a:3,e:"Caixa-branca olha o código que EXISTE. Se o requisito nunca foi codificado, ela não vê a lacuna — isso é fraqueza dela. (c) é verdadeira: dá para revisar código/pseudocódigo."});
add({id:"s1-26",ch:4,sim:1,src:S1,q:"O que MELHOR descreve a suposição de erro?",o:["Usar conhecimento e experiência de defeitos passados e erros típicos dos devs.","Usar sua experiência pessoal como desenvolvedor.","Imaginar-se usuário e adivinhar erros do usuário.","Refazer a tarefa de desenvolvimento."],a:0,e:"Suposição de erro = 'já vi esse tipo de erro antes, vou procurar ali'."});
add({id:"s1-27",ch:4,sim:1,src:S1,q:"Lançamento atrasado, testes começaram tarde, você conhece bem o domínio, a lista completa de requisitos não chegou e a gerência quer resultados logo. Qual técnica se encaixa MELHOR?",o:["Checklist.","Suposição de erro.","Teste exploratório.","Teste de ramificações."],a:2,e:"Pouca especificação + pressa = exploratório."});
add({id:"s1-28",ch:4,sim:1,src:S1,q:"Qual MELHOR descreve como documentar critérios de aceite?",o:["Fazer retrospectivas.","Usar o formato Dado/Quando/Então para descrever uma condição de exemplo da história.","Comunicação verbal.","Documentar riscos no plano de teste."],a:1,e:"Critério de aceite é escrito — e Dado/Quando/Então é o formato padrão."});
add({id:"s1-29",ch:4,sim:1,src:S1,w:1,q:"História: 'Como Editor, quero revisar o conteúdo antes de publicar para garantir a gramática.' Critérios: login como Editor; ver páginas; EDITAR conteúdo; adicionar comentários; SALVAR alterações; reatribuir 'proprietário do conteúdo' a outro editor. Qual o MELHOR teste ATDD?",o:["Testar se o editor pode salvar o documento após deletar o conteúdo da página.","Testar se o proprietário do conteúdo pode logar e atualizar.","Testar se o editor pode programar a publicação.","Testar se o editor pode atribuir a outro editor para fazer atualizações."],a:0,e:"Teste ATDD tem que sair DOS CRITÉRIOS. (a) cobre 'editar' + 'salvar'. (d) parece, mas o critério fala em reatribuir a função de PROPRIETÁRIO, não 'atribuir a outro editor'."});
add({id:"s1-30",ch:5,sim:1,src:S1,q:"Como os testadores agregam valor ao planejamento de iteração e lançamento?",o:["Determinam a prioridade das histórias.","Focam só no funcional.","Participam da identificação e avaliação detalhada de riscos das histórias.","Garantem qualidade pelo design antecipado de testes."],a:2,e:"Testador no planejamento: ajuda a achar riscos, estimar, definir testabilidade. Prioridade é do negócio."});
add({id:"s1-31",ch:5,sim:1,src:S1,q:"Quais DUAS são critérios de SAÍDA?<br>(1) Ambiente de teste pronto (2) Testador consegue logar (3) Densidade de defeitos estimada atingida (4) Requisitos em Dado/Quando/Então (5) Testes de regressão automatizados",o:["2 e 3","2 e 4","4 e 5","3 e 5"],a:3,e:"Entrada = 'posso começar?' (ambiente, acesso, requisitos prontos). Saída = 'posso terminar?' (métricas atingidas, regressão automatizada)."});
add({id:"s1-32",ch:5,sim:1,src:S1,q:"Estimativa de três pontos: otimista 2h, mais provável 11h, pessimista 14h. Qual a estimativa final?",o:["9","14","11","10"],a:3,e:"Fórmula: (O + 4×M + P) / 6 = (2 + 44 + 14) / 6 = 60/6 = 10."});
add({id:"s1-33",ch:5,sim:1,src:S1,w:1,q:"Casos (menor número = maior prioridade):<br><table class='tb'><tr><th>Caso</th><th>Condição</th><th>Prioridade</th><th>Depende de</th></tr><tr><td>TC001</td><td>Selecionar tipo de comida</td><td>3</td><td>–</td></tr><tr><td>TC002</td><td>Selecionar restaurante</td><td>2</td><td>TC001</td></tr><tr><td>TC003</td><td>Obter direção</td><td>1</td><td>TC002</td></tr><tr><td>TC004</td><td>Ligar para o restaurante</td><td>2</td><td>TC002</td></tr><tr><td>TC005</td><td>Fazer reserva</td><td>3</td><td>TC002</td></tr></table>Qual deve ser o TERCEIRO a executar?",o:["TC003","TC005","TC002","TC004"],a:0,e:"Primeiro as dependências: TC001 → TC002. Depois, entre os liberados, a maior prioridade (menor número): TC003."});
add({id:"s1-34",ch:5,sim:1,src:S1,q:"Encaixe nos quadrantes ágeis: (1) Usabilidade (2) Componente (3) Funcional (4) Confiabilidade<br>(A) Q1: tecnologia, apoia a equipe (B) Q2: negócio, apoia a equipe (C) Q3: negócio, critica o produto (D) Q4: tecnologia, critica o produto",o:["1C, 2A, 3B, 4D","1D, 2A, 3C, 4B","1C, 2B, 3D, 4A","1D, 2B, 3C, 4A"],a:0,e:"Q1 componente | Q2 funcional | Q3 usabilidade/exploratório/UAT | Q4 não funcional técnico (desempenho, confiabilidade, segurança)."});
add({id:"s1-35",ch:5,sim:1,src:S1,q:"Risco: tempo de resposta longo para gerar relatório (probabilidade média, impacto alto). Resposta: equipe independente faz teste de desempenho e usuários fazem alfa e beta. Que medida é essa?",o:["Aceite de risco.","Plano de contingência.","Mitigação de risco.","Transferência de risco."],a:2,e:"Testar para reduzir o risco = MITIGAÇÃO."});
add({id:"s1-36",ch:5,sim:1,src:S1,q:"Qual ferramenta mostra o trabalho concluído e o restante em uma iteração?",o:["Critérios de aceite.","Relatório de defeitos.","Relatório de conclusão de testes.","Gráfico de Burndown."],a:3,e:"Burndown = trabalho restante × tempo, atualizado todo dia."});
add({id:"s1-37",ch:5,sim:1,src:S1,q:"Você precisa atualizar um script automatizado por causa de um requisito novo. Qual processo indica criar uma nova versão no repositório?",o:["Rastreabilidade.","Teste de manutenção.","Gerenciamento de configuração.","Engenharia de requisitos."],a:2,e:"Versão de artefato = gerenciamento de configuração."});
add({id:"s1-38",ch:5,sim:1,src:S1,q:"Relatório: 'Aplicativo desliga ao inserir \"Test input: Sã\" no campo Nome da tela de novo usuário. Testei com várias contas admin. Log em anexo com erro fatal. Pelo TC-1305 deveria aceitar e criar o usuário. Alta prioridade, ligado ao REQ-0012.' Os devs disseram que não reproduz. O que está FALTANDO?",o:["Resultado esperado e real.","Referências e status.","Ambiente de teste e item de teste (versão).","Prioridade e gravidade."],a:2,e:"Esperado/real, referências e prioridade estão lá. Falta ONDE (ambiente) e O QUÊ (qual app/versão). Sem isso, não dá pra reproduzir."});
add({id:"s1-39",ch:6,sim:1,src:S1,q:"Qual atividade é apoiada por uma ferramenta de preparação de dados de teste?",o:["Monitoramento e controle.","Análise e modelagem.","Implementação e execução.","Conclusão."],a:2,e:"Dados de teste são criados na Implementação (deixar tudo pronto para executar)."});
add({id:"s1-40",ch:6,sim:1,src:S1,q:"Qual é um potencial RISCO da automação de testes?",o:["Pode introduzir regressões desconhecidas em produção.","Esforço para manter o testware pode não ser alocado adequadamente.","Ferramentas podem não ser confiáveis.","Pode reduzir o tempo de testes manuais."],a:1,e:"Riscos clássicos: expectativa irreal, subestimar esforço de manutenção, depender demais da ferramenta, fornecedor sumir. Reduzir teste manual é BENEFÍCIO."});
// ===== BANCO DE QUESTÕES — parte 4 (Simulado Completo 2 + extras) =====
// Obs.: o PDF do Simulado 2 não tinha gabarito — as respostas abaixo foram resolvidas com base no Syllabus CTFL 4.0.
const S2 = "Simulado Completo 2 (gabarito resolvido)";
add({id:"s2-1",ch:1,sim:2,src:S2,q:"Qual alternativa está INCORRETA sobre os objetivos típicos do teste?",o:["Avaliar produtos de trabalho como requisitos, histórias, projetos e código.","Comparar os resultados esperados com os resultados reais do objeto de teste.","Garantir a cobertura necessária de um objeto de teste.","Reduzir o nível de risco de qualidade inadequada."],a:1,e:"Comparar esperado × real é uma ATIVIDADE da execução, não um objetivo do teste. Os outros três estão na lista de objetivos do Syllabus."});
add({id:"s2-2",ch:1,sim:2,src:S2,q:"Qual alternativa está INCORRETA sobre teste e depuração?",o:["São atividades distintas.","O teste encontra falhas e a depuração encontra as causas.","Quando o teste estático identifica um defeito, a depuração se preocupa em removê-lo.","Teste e depuração devem ser executados juntos para ser mais eficiente."],a:3,e:"São complementares, mas separados. Não 'devem ser feitos juntos'. A (c) está no Syllabus: no estático, a depuração só remove o defeito."});
add({id:"s2-3",ch:1,sim:2,src:S2,q:"Muitas organizações chamam a área de testes de 'Controle de Qualidade (CQ)'. Está correto?",o:["Sim, porque o teste é uma das principais formas de Controle de Qualidade.","Sim, porque o CQ é preventivo.","Não, deveria ser Garantia de Qualidade porque o teste cuida da qualidade geral.","Não, deveria ser Garantia de Qualidade porque o teste pode ser estático e dinâmico."],a:0,e:"Teste é forma de QC. E QC é corretivo (não preventivo) — por isso (b) está errada."});
add({id:"s2-4",ch:1,sim:2,src:S2,q:"O PO entendeu errado a necessidade do cliente e documentou isso numa história de usuário, que foi desenvolvida e entregue. O cliente reclamou. O que existe na DOCUMENTAÇÃO da história?",o:["Erro.","Defeito.","Falha.","Causa-raiz."],a:1,e:"O PO se enganar = erro (humano). O que ficou escrito errado no documento = DEFEITO. Defeito pode estar em qualquer produto de trabalho, não só no código."});
add({id:"s2-5",ch:1,sim:2,src:S2,q:"Qual princípio, em alguns casos, pode dar resultado benéfico quando NÃO o seguimos?",o:["Testes exaustivos são impossíveis.","Testes antecipados economizam tempo e dinheiro.","Os testes se degradam.","Os testes dependem do contexto."],a:2,e:"O Syllabus diz: repetir os mesmos testes às vezes é bom — ex.: regressão automatizada. Então 'não atualizar' pode ser útil nesse caso."});
add({id:"s2-6",ch:1,sim:2,src:S2,q:"Associe grupos de atividades com produtos de trabalho:<br>I Planejamento · II Monitoramento e controle · III Análise · IV Modelagem · V Implementação · VI Execução · VII Conclusão<br>A Relatório de progresso · B Relatório de defeitos do software · C Condições de teste · D Casos de teste · E Lista de riscos · F Elementos do ambiente de teste · G Lições aprendidas",o:["I-E, II-A, III-C, IV-D, V-F, VI-B, VII-G","I-E, II-A, III-D, IV-C, V-F, VI-B, VII-G","I-D, II-A, III-C, IV-E, V-F, VI-B, VII-G","I-D, II-G, III-C, IV-E, V-F, VI-B, VII-A"],a:0,e:"Planejamento→riscos; Monitoramento→progresso; Análise→condições; Modelagem→casos; Implementação→ambiente; Execução→defeitos; Conclusão→lições."});
add({id:"s2-7",ch:1,sim:2,src:S2,q:"Qual NÃO é benefício da rastreabilidade entre base de teste e testware?",o:["Verificar se os requisitos são cobertos pelos casos.","Avaliar o risco residual a partir dos resultados ligados aos riscos.","Determinar impacto de mudanças, facilitar auditorias e governança de TI.","Determinar o AUTOR dos defeitos na base de teste e no software."],a:3,e:"Rastreabilidade não serve para caçar culpado."});
add({id:"s2-8",ch:1,sim:2,src:S2,q:"Qual alternativa está CORRETA sobre independência dos testes?",o:["Um certo grau de DEPENDÊNCIA torna o testador mais eficaz.","O principal benefício é que testadores independentes reconhecem tipos diferentes de falhas e defeitos, pelos vieses cognitivos diferentes.","Com independência, os autores não devem testar o próprio trabalho.","Deve-se usar um único nível de independência no projeto inteiro."],a:1,e:"Olhar de fora enxerga coisas diferentes. Autores podem sim testar (teste de componente pelo dev) e normalmente se usam vários níveis de independência."});
add({id:"s2-38",ch:1,sim:2,src:S2,q:"Em que grupo de atividades o relatório de CONCLUSÃO de teste é elaborado?",o:["Monitoramento e controle.","Implementação.","Execução.","Conclusão do teste."],a:3,e:"O nome já entrega: relatório de conclusão → Conclusão."});
add({id:"s2-9",ch:2,sim:2,src:S2,q:"Em qual abordagem os testes são escritos primeiro, depois o código para satisfazê-los e, em seguida, testes e código são refatorados?",o:["ATDD","BDD","TDD","DevOps"],a:2,e:"Escreve teste → código → refatora = TDD."});
add({id:"s2-10",ch:2,sim:2,src:S2,q:"Num projeto em Cascata, qual tarefa NÃO é possível?",o:["Teste estático assim que os requisitos estiverem escritos.","Teste dinâmico desde o início do projeto.","Análise de teste antes do código ficar pronto.","Modelagem de teste antes do código ficar pronto."],a:1,e:"Dinâmico precisa de código rodando — no cascata ele só existe no fim."});
add({id:"s2-11",ch:2,sim:2,src:S2,q:"Em qual nível de teste se usam estratégias de integração como bottom-up, top-down ou big-bang?",o:["Integração entre componentes.","Sistema.","Integração entre sistemas.","Aceite."],a:0,e:"Montar componentes de baixo pra cima, de cima pra baixo ou tudo de uma vez = integração de componentes."});
add({id:"s2-12",ch:2,sim:2,src:S2,q:"Você vai verificar se o software é fácil de usar, amigável e autoexplicativo. Que teste é esse?",o:["Funcional – Compatibilidade.","Funcional – Usabilidade.","Não funcional – Compatibilidade.","Não funcional – Usabilidade."],a:3,e:"Usabilidade é característica NÃO funcional."});
add({id:"s2-13",ch:2,sim:2,src:S2,q:"Um software em produção vai ser modificado e você teme efeitos colaterais em várias partes. Após análise de impacto, que testes fará?",o:["Confirmação.","Regressão.","Fumaça (smoke).","Integração."],a:1,e:"Medo de quebrar o que já funcionava = regressão."});
add({id:"s2-14",ch:2,sim:2,src:S2,q:"Quais são as principais formas de teste de aceite previstas no Syllabus?<br>i. Aceite de usuário · ii. Aceite operacional · iii. Contratual e normativo · iv. Alfa · v. Beta",o:["i, ii, iii, iv e v","i, iii, iv e v","i, ii, iv e v","i, ii e iii"],a:0,e:"As cinco: UAT, operacional, contratual/regulatório, alfa e beta."});
add({id:"s2-15",ch:3,sim:2,src:S2,q:"Sua responsabilidade na revisão é garantir reuniões eficazes, mediação, gestão do tempo e ambiente seguro. Qual sua função?",o:["Gerente.","Líder de teste.","Moderador ou Facilitador.","Revisor."],a:2,e:"Moderador/facilitador."});
add({id:"s2-16",ch:3,sim:2,src:S2,q:"Qual é o tipo de revisão MAIS FORMAL, com processo completo, todas as funções, e o autor NÃO pode ser líder nem relator?",o:["Walkthrough.","Inspeção.","Auditoria.","Revisão técnica."],a:1,e:"Inspeção. (Auditoria nem está entre os tipos de revisão do Syllabus.)"});
add({id:"s2-17",ch:3,sim:2,src:S2,q:"Qual NÃO é exemplo de defeito identificável no teste estático?",o:["Inconsistências nas histórias com regras e critérios de aceite.","Vulnerabilidades específicas (ex.: estouro de buffer).","Código executável (binário) do software.","Desvios de padrões de codificação."],a:2,e:"Binário não dá pra 'ler' — só executando."});
add({id:"s2-18",ch:3,sim:2,src:S2,q:"Em qual atividade do processo de revisão é criado um relatório de defeitos para cada defeito, para acompanhar as correções?",o:["Início da revisão.","Revisão individual.","Comunicação e análise de problemas.","Correção e relatório."],a:3,e:"Correção e relatório: cria relatório de defeito, acompanha correções, reporta resultado."});
add({id:"s2-19",ch:5,sim:2,src:S2,q:"App de agendamento de reuniões (menor número = maior prioridade):<br><table class='tb'><tr><th>ID</th><th>Descrição</th><th>Prioridade</th><th>Depende de</th></tr><tr><td>01.001</td><td>Reservar sala</td><td>4</td><td>01.004</td></tr><tr><td>01.002</td><td>Levantar participantes</td><td>2</td><td>–</td></tr><tr><td>01.003</td><td>Agendar reunião</td><td>1</td><td>01.001</td></tr><tr><td>01.004</td><td>Verificar disponibilidade</td><td>3</td><td>01.002</td></tr><tr><td>01.005</td><td>Enviar convite</td><td>1</td><td>01.003</td></tr></table>Qual deve ser o QUINTO a executar?",o:["01.001","01.003","01.004","01.005"],a:3,e:"Siga a corrente de dependências: 002 → 004 → 001 → 003 → 005. O quinto é 01.005."});
add({id:"s2-20",ch:4,sim:2,src:S2,q:"Contêiner deve aceitar cargas de 25.000 kg a 100.000 kg. Valores MÍNIMOS para particionamento de equivalência (variação de 1 t)?",o:["24.999, 25.000, 100.000 e 100.001 kg","24.000, 25.000, 100.000 e 101.000 kg","15.000, 50.000 e 150.000 kg","24.000, 25.000, 26.000, 99.000, 100.000 e 101.000 kg"],a:2,e:"PE = 1 valor por partição: abaixo (15 t), dentro (50 t), acima (150 t). Valores colados no limite são coisa de BVA."});
add({id:"s2-21",ch:4,sim:2,src:S2,q:"Mesmo contêiner (25 t a 100 t, variação 1 t). Valores de BVA de 2 valores?",o:["24.999, 25.000, 100.000 e 100.001 kg","24.000, 25.000, 100.000 e 101.000 kg","15.000, 50.000 e 150.000 kg","24.000, 25.000, 26.000, 99.000, 100.000 e 101.000 kg"],a:1,e:"Limite + vizinho de fora, com passo de 1 t (1.000 kg): 24.000 | 25.000 e 100.000 | 101.000. A (a) usa passo de 1 kg — errado pelo enunciado."});
add({id:"s2-22",ch:4,sim:2,src:S2,q:"Mesmo contêiner. Valores de BVA de 3 valores?",o:["24.999, 25.000, 100.000 e 100.001 kg","24.000, 25.000, 100.000 e 101.000 kg","15.000, 50.000 e 150.000 kg","24.000, 25.000, 26.000, 99.000, 100.000 e 101.000 kg"],a:3,e:"Vizinho antes + limite + vizinho depois, nos dois limites = 6 valores."});
add({id:"s2-25",ch:4,sim:2,src:S2,q:"'Quando o código tem só um único if, sem loop nem CASE, qualquer caso de teste único resulta em 50% de cobertura de ramificação.' Qual alternativa está correta?",o:["Verdadeira. Qualquer caso dá 100% de instrução e portanto 50% de ramificação.","Verdadeira. Qualquer caso único faz o if dar verdadeiro OU falso.","Falsa. Um caso só garante 25%.","Falsa. Depende do software."],a:1,e:"Um if tem 2 saídas. Um caso passa por UMA delas → 1/2 = 50%. A (a) erra porque um caso nem sempre dá 100% de instrução (se cair no 'falso' pula o corpo do if)."});
add({id:"s2-26",ch:4,sim:2,src:S2,q:"Bônus se trabalhar mais de 1 ano E atingir uma meta previamente acordada.<br><table class='tb'><tr><th>Condição</th><th colspan=4>Valores</th></tr><tr><td>Mais de 1 ano</td><td>Sim</td><td>Não</td><td>Não</td><td>Sim</td></tr><tr><td>Meta acordada</td><td>Não</td><td>Não</td><td>Sim</td><td>Sim</td></tr><tr><td>Meta atingida</td><td>Não</td><td>Não</td><td>Sim</td><td>Sim</td></tr><tr><th>Ação (bônus)</th><td>Não</td><td>Não</td><td>Não</td><td>Sim</td></tr></table>Qual caso representa uma situação REAL que está AUSENTE na tabela?",o:["Cond1=Sim, Cond2=Não, Cond3=Sim, Ação=Não","Cond1=Sim, Cond2=Sim, Cond3=Não, Ação=Sim","Cond1=Não, Cond2=Não, Cond3=Sim, Ação=Não","Cond1=Não, Cond2=Sim, Cond3=Não, Ação=Não"],a:3,e:"Não dá pra atingir meta que não foi acordada → (a) e (c) são impossíveis. (b) é possível mas a ação está errada (não atingiu = sem bônus). (d): menos de 1 ano, meta acordada, não atingida, sem bônus — real e falta na tabela."});
add({id:"s2-27",ch:4,sim:2,src:S2,img:"bomba",q:"Bomba de gasolina (só cartão). Cada teste começa em 'Aguardando cliente' e termina quando uma transição chega de volta nele. Mínimo de casos para cobrir todas as TRANSIÇÕES válidas?",o:["1","3","4","7"],a:2,e:"Toda volta ao início encerra o teste, então cada 'volta' é um caso: cartão inválido | válido→cancelar | válido→tipo→cancelar | válido→tipo→injetar→finalizar = 4."});
add({id:"s2-28",ch:4,sim:2,src:S2,img:"bomba",q:"Mesma bomba. Mínimo de casos para cobrir todos os ESTADOS?",o:["1","3","4","7"],a:0,e:"Um único caminho completo (válido → tipo → injetar → finalizar) passa pelos 4 estados."});
add({id:"s2-29",ch:4,sim:2,src:S2,q:"Quais são os três aspectos críticos das histórias de usuário (3C)?",o:["Cartão, conversação e confirmação.","Cartão, comunicação e confirmação.","Carta, conversação e confirmação.","Carta, comunicação e confirmação."],a:0,e:"Cartão, Conversação, Confirmação."});
add({id:"s2-30",ch:5,sim:2,src:S2,q:"Qual é exemplo de critério de ENTRADA?",o:["Nível de cobertura alcançado.","Todos os testes de fumaça passaram.","Testes planejados foram executados.","Número de riscos mitigados."],a:1,e:"Smoke test passou = 'dá pra começar a testar de verdade'. Os outros medem o FIM (saída)."});
add({id:"s2-31",ch:5,sim:2,src:S2,q:"Três pontos: otimista 5h, mais provável 8h, pessimista 17h. Estimativa final?",o:["7 horas","8 horas","9 horas","10 horas"],a:2,e:"(5 + 4×8 + 17) / 6 = 54 / 6 = 9."});
add({id:"s2-32",ch:5,sim:2,src:S2,q:"Estimativa por extrapolação para a 4ª iteração, com: 1ª = 43, 2ª = 50, 3ª = 60 pontos.",o:["51","55","63","70"],a:0,e:"Extrapolação aqui = média das anteriores: (43+50+60)/3 = 51."});
add({id:"s2-33",ch:5,sim:2,src:S2,q:"Em que quadrante estão os testes geralmente de responsabilidade dos desenvolvedores?",o:["Q1","Q2","Q3","Q4"],a:0,e:"Q1 = testes de componente e integração de componente, voltados à tecnologia, feitos pelos devs."});
add({id:"s2-34",ch:5,sim:2,src:S2,q:"Técnica baseada em experiência em que os testes são modelados, executados e avaliados simultaneamente. Qual é e em que quadrante está?",o:["Suposição de erro – Q2","Suposição de erro – Q3","Exploratório – Q2","Exploratório – Q3"],a:3,e:"Tudo ao mesmo tempo = exploratório. Está no Q3 (negócio, crítica ao produto)."});
add({id:"s2-35",ch:5,sim:2,src:S2,q:"Qual é exemplo de risco de PROJETO?",o:["Problemas de usabilidade por usuários desconhecidos.","Redução de custo devido à concorrência com outros projetos.","Tempo de resposta inadequado por muitos acessos simultâneos.","Vulnerabilidade de segurança por mudanças de escopo."],a:1,e:"Risco de projeto = gestão (prazo, custo, pessoas, fornecedor). Risco de produto = qualidade do software (usabilidade, desempenho, segurança)."});
add({id:"s2-37",ch:5,sim:2,src:S2,q:"Em que grupo de atividades o relatório de PROGRESSO é elaborado?",o:["Planejamento.","Monitoramento e controle.","Análise.","Modelagem."],a:1,e:"Acompanhar o andamento = monitoramento e controle."});
add({id:"s2-39",ch:6,sim:2,src:S2,q:"Como classificar ferramentas de CI (Integração Contínua) e CD (Entrega Contínua)?",o:["Gerenciamento.","Teste não funcional.","Colaboração.","DevOps."],a:3,e:"Pipeline CI/CD = ferramenta de DevOps."});
add({id:"s2-40",ch:6,sim:2,src:S2,q:"Qual pode ser considerado um risco da automação?",o:["Expectativas irreais sobre os benefícios da ferramenta, incluindo funcionalidade e facilidade de uso.","A ferramenta entrar em 'looping' por inteligência.","A ferramenta introduzir testes desconhecidos que afetam desempenho.","A ferramenta introduzir dados que interferem nos testes manuais."],a:0,e:"Expectativa irreal é o risco nº 1 da lista do Syllabus."});

// ---------- EXTRA (para reforçar Cap. 5 e 6, que têm poucas questões nos seus simulados) ----------
const EX = "Extra – reforço (Syllabus)";
add({id:"ex-1",ch:5,src:EX,q:"Um risco tem probabilidade ALTA e impacto ALTO. O que isso significa para o teste?",o:["Pode ser ignorado.","Deve receber mais atenção e teste mais cedo e mais profundo.","Deve ir para o fim da fila.","Só deve ser tratado na conclusão."],a:1,e:"Nível de risco = probabilidade × impacto. Quanto maior, mais cedo e mais teste."});
add({id:"ex-2",ch:5,src:EX,q:"Quais são as 4 respostas possíveis a um risco (controle de risco)?",o:["Mitigar, aceitar, transferir, plano de contingência.","Planejar, analisar, modelar, executar.","Ignorar, esconder, adiar, cancelar.","Identificar, avaliar, testar, liberar."],a:0,e:"Mitigar (reduzir, ex.: testando), Aceitar, Transferir (seguro, terceiro), Contingência (plano B)."});
add({id:"ex-3",ch:5,src:EX,q:"Qual é exemplo de risco de PRODUTO?",o:["Atraso na entrega do fornecedor.","Falta de pessoal qualificado.","Cálculo errado de juros no sistema.","Corte de orçamento."],a:2,e:"Produto = defeito/qualidade do software. Os outros são riscos de projeto."});
add({id:"ex-4",ch:5,src:EX,q:"Na pirâmide de testes, o que fica na BASE?",o:["Testes de ponta a ponta pela interface (lentos).","Muitos testes pequenos, rápidos e isolados (unidade/componente).","Testes exploratórios manuais.","Testes de aceite do usuário."],a:1,e:"Base larga = muitos testes de unidade, rápidos e baratos. Topo estreito = poucos testes E2E, lentos."});
add({id:"ex-5",ch:5,src:EX,q:"Qual é o propósito do gerenciamento de configuração no teste?",o:["Definir prioridades de negócio.","Identificar, controlar e versionar itens de teste e testware, garantindo rastreabilidade.","Medir produtividade.","Aprovar liberações."],a:1,e:"Saber exatamente QUAL versão de cada coisa foi testada."});
add({id:"ex-6",ch:5,src:EX,q:"Qual métrica é típica do monitoramento de teste?",o:["Salário da equipe.","Percentual de casos executados, aprovados e falhados.","Número de reuniões.","Quantidade de e-mails."],a:1,e:"Métricas: progresso de execução, cobertura, defeitos (quantidade, densidade), custo."});
add({id:"ex-7",ch:5,src:EX,q:"Estimativa baseada em RAZÃO: no projeto anterior a relação dev:teste foi 3:2. Agora o esforço de desenvolvimento é 600 pessoa-dia. Estimativa de teste?",o:["200","300","400","900"],a:2,e:"600 × 2/3 = 400 pessoa-dia."});
add({id:"ex-8",ch:5,src:EX,q:"O que é o Wideband Delphi?",o:["Uma técnica de estimativa por especialistas em rodadas até chegar a consenso.","Uma ferramenta de automação.","Um tipo de revisão.","Um nível de teste."],a:0,e:"Especialistas estimam separadamente, discutem e repetem até convergir. O Planning Poker é uma variação."});
add({id:"ex-9",ch:5,src:EX,q:"O que um relatório de defeito deve ter para ser útil?",o:["Só o título.","Identificador, título, ambiente, passos para reproduzir, resultado esperado e real, gravidade/prioridade, status.","Apenas a opinião do testador.","Somente o nome do dev culpado."],a:1,e:"O objetivo é permitir que alguém REPRODUZA e corrija. Ambiente e versão são essenciais."});
add({id:"ex-10",ch:6,src:EX,q:"Qual é um BENEFÍCIO da automação de testes?",o:["Elimina a necessidade de pensar.","Reduz trabalho manual repetitivo e aumenta a consistência/repetibilidade.","Ferramentas nunca falham.","Configurar a automação é barato."],a:1,e:"Benefícios: menos repetição manual, mais consistência, medidas objetivas, feedback mais rápido."});
add({id:"ex-11",ch:6,src:EX,q:"Ferramentas que ajudam a gerenciar requisitos, testes, defeitos e configuração pertencem a qual categoria?",o:["Ferramentas de gerenciamento.","Ferramentas de teste estático.","Ferramentas de teste não funcional.","Ferramentas de colaboração."],a:0,e:"Gerenciamento: SDLC, requisitos, testes, defeitos, configuração."});
add({id:"ex-12",ch:6,src:EX,q:"Uma ferramenta de análise estática de código ajuda em quê?",o:["Executar testes de carga.","Encontrar problemas no código SEM executá-lo (padrões, vulnerabilidades, complexidade).","Gerar dados de teste.","Criar gráficos de burndown."],a:1,e:"Estático = sem executar."});
// ===== CONTEÚDO DE ESTUDO =====
const CHAPTERS = [
 {n:1, t:"Fundamentos de Teste", icon:"🧱", peso:8, cards:[
  {h:"Por que testar?", b:"Teste serve para <b>achar defeitos</b>, <b>reduzir risco</b>, <b>dar informação</b> para decidir e <b>aumentar a confiança</b>. Ele nunca prova que não há defeitos."},
  {h:"Teste × Depuração", b:"<b>Teste</b> mostra que algo está errado (revela a falha).<br><b>Depuração</b> acha a causa e conserta (reproduz → diagnostica → corrige).<br>São atividades diferentes."},
  {h:"QA × QC", b:"<b>QC (Controle de Qualidade)</b> = olha o <b>produto</b>, é <b>corretivo</b>. O <b>teste é uma forma de QC</b>.<br><b>QA (Garantia da Qualidade)</b> = olha o <b>processo</b>, é <b>preventivo</b>."},
